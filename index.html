<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SmartScan</title>

<style>
:root{
  --bg:#0e0f12;
  --fg:#e7e9ee;
  --card:#14161c;
  --border:rgba(255,255,255,.12);
  --btn:#e6372a;
  --danger:#ff4d4f;
  --tap:44px;
  --colw:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font:16px system-ui;
}

.wrap{max-width:1000px;margin:auto;padding:18px 4vw;display:flex;flex-direction:column;gap:12px}

#landing{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
background:#0e0f12
}

.start{
width:240px;height:240px;border-radius:50%;
background:#e6372a;color:#fff;
font-size:32px;font-weight:900;
border:none;cursor:pointer
}

#app{display:none}

.topbar{display:flex;justify-content:flex-end;gap:8px}

.btn{
border:1px solid var(--border);
background:#1a1d25;
color:#fff;
padding:8px 12px;
border-radius:10px;
cursor:pointer
}

.card{
background:#14161c;
border:1px solid var(--border);
border-radius:14px;
overflow:hidden
}

.thead,.tbody{
display:flex;
gap:8px;
padding:10px 12px;
overflow-x:auto
}

.thead{border-bottom:1px solid var(--border)}

.head-cell{
min-width:320px;
display:flex;
align-items:center;
gap:8px
}

.head-edit{
flex:1;
background:transparent;
color:#fff;
border:none;
outline:none
}

.col{
min-width:320px;
display:flex;
flex-direction:column;
gap:8px
}

.trow{
display:grid;
grid-template-columns:1fr 44px;
gap:8px;
border:1px solid var(--border);
border-radius:12px;
padding:8px
}

.cell input{
width:100%;
background:transparent;
border:none;
color:#fff
}

.clear-btn{
width:44px;height:44px;
border-radius:12px;
border:1px solid #ff4d4f;
background:transparent;
color:#ff4d4f;
cursor:pointer
}

.placeholder button{
width:100%;
height:44px;
border-radius:10px;
border:1px dashed #3a3f4b;
background:#1a1d25;
color:#fff;
font-weight:800
}

.modal{
position:fixed;inset:0;
display:none;
background:rgba(0,0,0,.55)
}

.stage{background:#000;height:54vh}
</style>

<body>

<div class="wrap">

<section id="landing">
<button class="start" id="startBtn">START</button>
</section>

<section id="app">

<div class="topbar">
<button class="btn" id="copyAll">Copy All</button>
<button class="btn" id="exportXlsx">Export Sheet</button>
</div>

<div class="card">
<div class="thead" id="thead"></div>
<div class="tbody" id="tbody"></div>
</div>

</section>

</div>

<div class="modal" id="modal">

<div style="width:min(92vw,520px);margin:auto;background:#12131a;border-radius:14px">

<div style="display:flex;justify-content:flex-end;padding:10px">
<button class="btn" id="close">Close</button>
</div>

<div class="stage">
<video id="video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
</div>

<div id="hint" style="padding:8px;text-align:center;color:#aaa">
Allow camera access to start scanning
</div>

</div>

</div>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

const $=id=>document.getElementById(id)

const startBtn=$('startBtn')
const landing=$('landing')
const app=$('app')

const thead=$('thead')
const tbody=$('tbody')

const copyAllBtn=$('copyAll')
const exportBtn=$('exportXlsx')

const modal=$('modal')
const video=$('video')
const hint=$('hint')
const closeBtn=$('close')

let reader=null
let controls=null
let scanning=false
let targetCol=null

const columns=[]

startBtn.onclick=()=>{
landing.remove()
app.style.display='block'
addColumn('Code')
}

function addColumn(title){

const head=document.createElement('div')
head.className='head-cell'

const t=document.createElement('div')
t.className='head-edit'
t.contentEditable=true
t.textContent=title

head.appendChild(t)
thead.appendChild(head)

const col=document.createElement('div')
col.className='col'

tbody.appendChild(col)

appendPlaceholder(col)

columns.push({titleEl:t,colBody:col})

}

function appendPlaceholder(col){

const ph=document.createElement('div')
ph.className='placeholder'

const btn=document.createElement('button')
btn.textContent='+ Scan & Add'

btn.onclick=()=>{
targetCol=col
openModalAndScan()
}

ph.appendChild(btn)
col.appendChild(ph)

}

function makeDataRow(val){

const r=document.createElement('div')
r.className='trow'

const c=document.createElement('div')
c.className='cell'

const input=document.createElement('input')
input.value=val

c.appendChild(input)

const del=document.createElement('button')
del.className='clear-btn'
del.textContent='X'

del.onclick=()=>r.remove()

r.appendChild(c)
r.appendChild(del)

return r

}

function addValueToColumn(col,val){

const last=col.lastElementChild
const row=makeDataRow(val)

col.insertBefore(row,last)

const rows=col.querySelectorAll('.trow')

if(rows.length>500){
rows[0].remove()
}

}

function openModalAndScan(){
modal.style.display='flex'
startScan()
}

function closeModal(){
stopScan()
modal.style.display='none'
}

async function startScan(){

if(scanning) return

scanning=true

reader=new ZXing.BrowserMultiFormatReader()

const hints=new Map()
hints.set(
ZXing.DecodeHintType.POSSIBLE_FORMATS,
[
ZXing.BarcodeFormat.CODE_128,
ZXing.BarcodeFormat.QR_CODE
]
)

reader.hints=hints

await reader.decodeFromConstraints(
{video:{facingMode:'environment'}},
video,
(result,err,c)=>{

controls=c

if(!scanning) return

if(result){

const val=result.getText().trim()

if(val){

stopScan()
onScanSuccess(val)

}

}

}
)

}

function stopScan(){

scanning=false

try{controls?.stop()}catch{}

controls=null

try{
const stream=video.srcObject
if(stream)stream.getTracks().forEach(t=>t.stop())
}catch{}

video.srcObject=null

try{reader?.reset()}catch{}

reader=null

}

function onScanSuccess(val){

const col=targetCol||columns[0]?.colBody

if(col){
addValueToColumn(col,val)
}

navigator.clipboard?.writeText(val).catch(()=>{})

setTimeout(closeModal,100)

targetCol=null

}

closeBtn.onclick=closeModal

modal.onclick=e=>{
if(e.target===modal)closeModal()
}

addEventListener('pagehide',stopScan)
addEventListener('beforeunload',stopScan)


copyAllBtn.onclick=()=>{

let text=''
let total=0

columns.forEach((c,i)=>{

const title=(c.titleEl.innerText||`Col ${i+1}`).trim()

const rows=[...c.colBody.querySelectorAll('.trow')]
.map(r=>r.querySelector('input').value.trim())
.filter(v=>v!=='')

if(rows.length===0)return

text+=`${title} (${rows.length})\n`

rows.forEach(v=>{
text+=v+'\n'
total++
})

text+='\n'

})

text+=`TOTAL: ${total}`

navigator.clipboard.writeText(text)

}

exportBtn.onclick=()=>{

const headers=columns.map(c=>c.titleEl.innerText||'Column')

const maxRows=Math.max(...columns.map(c=>c.colBody.querySelectorAll('.trow').length))

const data=[headers]

for(let i=0;i<maxRows;i++){

const row=columns.map(c=>{
const trs=c.colBody.querySelectorAll('.trow')
return trs[i]?.querySelector('input').value||''
})

data.push(row)

}

const ws=XLSX.utils.aoa_to_sheet(data)

const wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,'Sheet1')

XLSX.writeFile(wb,'SmartScan.xlsx')

}

</script>

</body>
</html>
