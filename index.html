<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Scanner</title>
<style>
  :root{ --bg:#0b0b0f; --border:rgba(255,255,255,.14); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    min-height:100svh;
    padding:calc(env(safe-area-inset-top) + 6svh) 4vw calc(env(safe-area-inset-bottom) + 6svh);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial;
  }

  /* 🚀 Ultimate “SCAN NOW” Launch Button */
  .launch{
    --red-light:#ff4b3e;
    --red-main:#e11900;
    --red-dark:#9b0e05;
    --chrome:#d0d2d5;
    --glow:rgba(255,45,25,.45);

    position:relative;
    width:150px; height:150px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer; user-select:none;
    color:#fff; font-weight:900; font-size:18px; letter-spacing:.06em;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
    border:none;
    background:
      radial-gradient(120% 120% at 30% 25%, #fff8 0%, transparent 40%),
      linear-gradient(180deg, var(--red-light) 0%, var(--red-main) 40%, var(--red-dark) 100%);
    box-shadow:
      0 0 0 6px var(--chrome),
      0 0 0 10px rgba(0,0,0,.3),
      inset 0 6px 10px rgba(255,255,255,.25),
      inset 0 -8px 14px rgba(0,0,0,.5),
      0 0 20px var(--glow),
      0 0 60px var(--glow);
    animation: pulse 3s ease-in-out infinite;
    transition: transform .12s cubic-bezier(.22,1.3,.32,1), box-shadow .12s ease, filter .12s ease;
  }

  /* 💡 外圈镀铬金属框 */
  .launch::before{
    content:"";
    position:absolute; inset:-10px; border-radius:50%;
    background:linear-gradient(135deg,#f9f9fa 0%,#7a7b7c 35%,#c0c2c3 70%,#f8f9f9 100%);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.6),
      inset 0 -2px 3px rgba(0,0,0,.25),
      0 0 12px rgba(255,255,255,.1);
    z-index:-1;
  }

  /* ✨ 顶部玻璃高光 */
  .launch::after{
    content:"";
    position:absolute; inset:10% 18% auto 18%;
    height:26%; border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));
    filter:blur(.3px); pointer-events:none;
  }

  /* 🔥 呼吸发光动画 */
  @keyframes pulse {
    0%,100% { box-shadow:
      0 0 0 6px var(--chrome),
      0 0 0 10px rgba(0,0,0,.3),
      inset 0 6px 10px rgba(255,255,255,.25),
      inset 0 -8px 14px rgba(0,0,0,.5),
      0 0 14px var(--glow),
      0 0 32px var(--glow); }
    50% { box-shadow:
      0 0 0 6px var(--chrome),
      0 0 0 10px rgba(0,0,0,.3),
      inset 0 6px 10px rgba(255,255,255,.25),
      inset 0 -8px 14px rgba(0,0,0,.5),
      0 0 32px var(--glow),
      0 0 80px var(--glow); }
  }

  /* 💥 按下反馈：下沉、发光收缩 */
  .launch:active{
    transform:translateY(2px) scale(.97);
    filter:brightness(.95) saturate(.9);
    box-shadow:
      0 0 0 5px var(--chrome),
      0 0 0 10px rgba(0,0,0,.25),
      inset 0 6px 8px rgba(0,0,0,.5),
      inset 0 -4px 8px rgba(255,255,255,.2),
      0 0 14px var(--glow),
      0 0 32px var(--glow);
  }

  /* 🔲 聚焦态 */
  .launch:focus-visible{
    outline:none;
    box-shadow:
      0 0 0 4px #0a84ff,
      0 0 0 8px rgba(10,132,255,.35),
      0 0 30px var(--glow),
      0 0 60px var(--glow);
  }

  /* 减少动画模式 */
  @media (prefers-reduced-motion:reduce){
    .launch{animation:none;transition:none;}
  }

  /* 弹窗部分（保持简洁） */
  .modal{position:fixed;inset:0;display:none;z-index:50;background:rgba(0,0,0,.6);
         padding:calc(env(safe-area-inset-top)+8px) 12px calc(env(safe-area-inset-bottom)+8px);}
  .modal.show{display:flex;align-items:center;justify-content:center}
  .sheet{
    width:min(92vw,520px);max-height:min(82svh,82dvh);
    background:#111318;border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .bar{display:flex;justify-content:flex-end;padding:8px;border-bottom:1px solid var(--border)}
  .x{appearance:none;border:1px solid var(--border);background:#151821;color:#fff;
     border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
  .stage{position:relative;background:#000;height:clamp(240px,54svh,520px)}
  video{width:100%;height:100%;object-fit:cover}
  .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .box{width:180px;height:180px;border:2px solid #fff;border-radius:10px}

  .res{padding:10px 12px;border-top:1px solid var(--border);display:none;color:#dfe3ea}
  .res pre{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:22svh;overflow:auto}
  .actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--border);background:#151821;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;text-decoration:none}
  .btn.primary{background:#0a84ff;border:none}
  .hint{padding:8px 12px;border-top:1px solid var(--border);color:#a3a8b2;font-size:12.5px}
</style>

<body>
  <!-- 主界面：只有红色按钮 -->
  <button class="launch" id="launch">SCAN&nbsp;NOW</button>

  <!-- 扫码弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog">
    <div class="sheet">
      <div class="bar"><button class="x" id="close">Close</button></div>
      <div class="stage">
        <video id="v" playsinline muted></video>
        <div class="frame"><div class="box"></div></div>
      </div>
      <div class="res" id="res">
        <pre id="text"></pre>
        <div class="actions">
          <button class="btn" id="copy">Copy</button>
          <a class="btn primary" id="open" target="_blank" rel="noreferrer" style="display:none">Open Link</a>
          <button class="btn" id="again">Scan Again</button>
        </div>
      </div>
      <div class="hint" id="hint">Allow camera access to start scanning.</div>
    </div>
  </div>

  <!-- QR识别库 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const launch=$('launch'),modal=$('modal'),closeBtn=$('close'),
          v=$('v'),hint=$('hint'),res=$('res'),text=$('text'),
          copyBtn=$('copy'),again=$('again'),openLink=$('open');

    let stream=null,raf=null,scanning=false;
    const cvs=document.createElement('canvas'),ctx=cvs.getContext('2d');

    const openModal=()=>{modal.classList.add('show');start();}
    const closeModal=()=>{stop();modal.classList.remove('show');res.style.display='none';text.textContent='';openLink.style.display='none';}
    const showHint=m=>hint.textContent=m||'';

    async function start(){
      showHint('Starting camera…');
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      }catch{
        showHint('Camera unavailable. Use HTTPS / allow permission.');
        return;
      }
      v.srcObject=stream;await v.play();
      scanning=true;showHint('Point at a QR code.');loop();
    }
    function stop(){
      if(raf)cancelAnimationFrame(raf),raf=null;
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      scanning=false;
    }
    function loop(){
      if(!scanning)return;
      if(v.readyState>=2&&v.videoWidth){
        const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(560/Math.min(vw,vh),1);
        const w=Math.round(vw*s),h=Math.round(vh*s);
        cvs.width=w;cvs.height=h;ctx.drawImage(v,0,0,w,h);
        const img=ctx.getImageData(0,0,w,h);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
        if(code&&code.data){onResult(code.data);return;}
      }
      raf=requestAnimationFrame(loop);
    }
    function onResult(val){
      stop();res.style.display='block';text.textContent=val||'';
      const isURL=/^https?:\/\//i.test(val);
      openLink.style.display=isURL?'inline-block':'none';
      if(isURL)openLink.href=val;
      navigator.clipboard?.writeText(val).catch(()=>{});
      showHint('Result copied to clipboard.');
    }

    launch.onclick=openModal;
    closeBtn.onclick=closeModal;
    modal.onclick=e=>{if(e.target===modal)closeModal();}
    again.onclick=()=>{res.style.display='none';start();}
    copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(text.textContent.trim());showHint('Copied.');}catch{}}
    addEventListener('pagehide',stop);addEventListener('beforeunload',stop);
  </script>
</body>
</html>
