<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Scanner · Minimal</title>
<style>
  :root{
    --bg:#0e0f12;
    --fg:#e7e9ee;
    --muted:#9aa1ad;
    --border:rgba(255,255,255,.12);
    --btn:#e6372a; /* 扁平红 */
    --btn-press:#c82f24;
    --ring:#2563eb; /* 扁平高亮蓝，用作 focus ring */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    min-height:100svh;
    padding:calc(env(safe-area-inset-top) + 6svh) 4vw calc(env(safe-area-inset-bottom) + 6svh);
    display:flex; align-items:center; justify-content:center;
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial;
    -webkit-font-smoothing:antialiased;
  }

  /* 扁平化主按钮（整页只此一物） */
  .launch{
    width:120px;height:120px;border-radius:28px;
    display:grid;place-items:center;cursor:pointer;user-select:none;
    background:var(--btn); color:#fff; font-weight:800; font-size:16px; letter-spacing:.04em;
    border:1px solid transparent;
    transition:transform .06s ease, background-color .06s ease, box-shadow .06s ease, border-color .06s ease;
    box-shadow:0 0 0 1px rgba(0,0,0,.25); /* 极轻的外描边，增强边界感 */
  }
  .launch:hover{ transform:translateY(0); }
  .launch:active{ transform:translateY(1px); background:var(--btn-press); }
  .launch:focus-visible{
    outline: none;
    border-color: color-mix(in srgb, var(--ring) 70%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent);
  }

  /* 弹窗（扁平边界，极简） */
  .modal{position:fixed;inset:0;display:none;z-index:50;background:rgba(0,0,0,.55);
         padding:calc(env(safe-area-inset-top)+10px) 12px calc(env(safe-area-inset-bottom)+10px);}
  .modal.show{display:flex;align-items:center;justify-content:center}
  .sheet{
    width:min(92vw,520px);max-height:min(82svh,82dvh);
    background:#12131a;border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .bar{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
  .x{appearance:none;border:1px solid var(--border);background:#161821;color:var(--fg);
     border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
  .x:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent)}
  .stage{position:relative;background:#000;height:clamp(240px,54svh,520px)}
  video{width:100%;height:100%;object-fit:cover}

  /* 简洁取景框（扁平白线） */
  .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .box{width:170px;height:170px;border:2px solid #fff;border-radius:12px}

  .res{padding:10px 12px;border-top:1px solid var(--border);display:none;color:#cfd5df}
  .res pre{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:22svh;overflow:auto}
  .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--border);background:#161821;color:var(--fg);border-radius:10px;padding:6px 12px;font-size:13px;text-decoration:none}
  .btn.primary{background:#2563eb;border-color:transparent}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent)}
  .hint{padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px}
</style>

<body>
  <!-- 主界面仅一个按钮 -->
  <button class="launch" id="launch">SCAN&nbsp;NOW</button>

  <!-- 扫码弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog">
    <div class="sheet">
      <div class="bar"><button class="x" id="close">Close</button></div>
      <div class="stage">
        <video id="v" playsinline muted></video>
        <div class="frame"><div class="box"></div></div>
      </div>
      <div class="res" id="res">
        <pre id="text"></pre>
        <div class="actions">
          <button class="btn" id="copy">Copy</button>
          <a class="btn primary" id="open" target="_blank" rel="noreferrer" style="display:none">Open Link</a>
          <button class="btn" id="again">Scan Again</button>
        </div>
      </div>
      <div class="hint" id="hint">Allow camera access to start scanning.</div>
    </div>
  </div>

  <!-- QR 识别库：如需完全离线，可把 jsQR.min.js 内容内联 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const launch=$('launch'),modal=$('modal'),closeBtn=$('close'),
          v=$('v'),hint=$('hint'),res=$('res'),text=$('text'),
          copyBtn=$('copy'),again=$('again'),openLink=$('open');

    let stream=null,raf=null,scanning=false;
    const cvs=document.createElement('canvas'),ctx=cvs.getContext('2d');

    const openModal=()=>{modal.classList.add('show');start();}
    const closeModal=()=>{stop();modal.classList.remove('show');res.style.display='none';text.textContent='';openLink.style.display='none';}
    const showHint=m=>hint.textContent=m||'';

    async function start(){
      showHint('Starting camera…');
      try{
        stream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
        });
      }catch{
        showHint('Camera unavailable. Use HTTPS / allow permission.');
        return;
      }
      v.srcObject=stream;await v.play();
      scanning=true;showHint('Point at a QR code.');loop();
    }
    function stop(){
      if(raf)cancelAnimationFrame(raf),raf=null;
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      scanning=false;
    }
    function loop(){
      if(!scanning)return;
      if(v.readyState>=2&&v.videoWidth){
        const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(560/Math.min(vw,vh),1);
        const w=Math.round(vw*s),h=Math.round(vh*s);
        cvs.width=w;cvs.height=h;ctx.drawImage(v,0,0,w,h);
        const img=ctx.getImageData(0,0,w,h);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
        if(code&&code.data){onResult(code.data);return;}
      }
      raf=requestAnimationFrame(loop);
    }
    function onResult(val){
      stop();res.style.display='block';text.textContent=val||'';
      const isURL=/^https?:\/\//i.test(val);
      openLink.style.display=isURL?'inline-block':'none';
      if(isURL)openLink.href=val;
      navigator.clipboard?.writeText(val).catch(()=>{});
      showHint('Result copied to clipboard.');
    }

    launch.onclick=openModal;
    closeBtn.onclick=closeModal;
    modal.onclick=e=>{if(e.target===modal)closeModal();}
    again.onclick=()=>{res.style.display='none';start();}
    copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(text.textContent.trim());showHint('Copied.');}catch{}}
    addEventListener('pagehide',stop);addEventListener('beforeunload',stop);
  </script>
</body>
</html>
