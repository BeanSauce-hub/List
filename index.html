<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>二维码扫描 · PWA</title>

<!-- PWA 基础 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
<defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'>
<stop offset='0' stop-color='%23ffffff'/><stop offset='1' stop-color='%23f0f0f3'/></linearGradient></defs>
<rect width='512' height='512' rx='110' fill='url(%23g)'/>
<circle cx='256' cy='256' r='150' fill='%230a84ff'/>
<text x='256' y='282' font-family='Arial' font-size='120' text-anchor='middle' fill='white'>QR</text>
</svg>">

<style>
  :root{ --bg:#f5f5f7; --fg:#111113; --muted:#6e6e73; --primary:#0a84ff; --card:#ffffff; --border:rgba(0,0,0,.08); }
  *{box-sizing:border-box} html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{text-align:center}
  h1{font-size:18px; margin:0 0 10px}
  .sub{color:var(--muted); font-size:13px; margin-bottom:28px}

  /* 中央大圆按钮：苹果简约风 */
  .scan-btn{
    width:170px; height:170px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer; user-select:none;
    background:linear-gradient(180deg,#fff,#f0f0f3); border:1px solid var(--border);
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 12px 32px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    color:#111; font-weight:800; font-size:22px; letter-spacing:.02em;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .scan-btn:active{ transform:scale(.98); box-shadow:0 6px 18px rgba(0,0,0,.16), 0 1px 2px rgba(0,0,0,.08); }

  /* 模态弹窗 + 弹簧动效 */
  .modal{ position:fixed; inset:0; display:none; }
  .modal.show{ display:block; }
  .backdrop{
    position:absolute; inset:0; background:rgba(0,0,0,.28);
    backdrop-filter:saturate(120%) blur(8px); opacity:0; animation:fadeIn .28s ease forwards;
  }
  .sheet{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9);
    width:min(520px,92vw); border-radius:24px; overflow:hidden; background:var(--card);
    border:1px solid var(--border); box-shadow:0 30px 70px rgba(0,0,0,.25);
    opacity:0; animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes fadeIn { to { opacity:1 } }
  /* 轻微过冲的“弹簧”效果：scale 1.04 -> 1 */
  @keyframes pop {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.9) }
    60%  { opacity:1; transform:translate(-50%,-50%) scale(1.04) }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1) }
  }

  .sheet header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .title{font-weight:700}
  .xbtn,.mini{ appearance:none; border:1px solid var(--border); background:#fff; color:#111;
    border-radius:12px; padding:8px 12px; font-size:13px; cursor:pointer;
  }
  .xbtn{ border-radius:999px }
  .mini.primary{ background:var(--primary); border-color:transparent; color:#fff }

  .stage{ position:relative; background:#000; aspect-ratio:9/16; }
  video{ width:100%; height:100%; object-fit:cover }
  .mask{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none }
  .box{ width:240px; height:240px; border:2px solid #fff; border-radius:20px; box-shadow:0 0 0 9999px rgba(0,0,0,.35) }

  .res{ padding:12px 14px; border-top:1px solid var(--border); display:none }
  .res pre{ margin:8px 0 0; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas; white-space:pre-wrap; word-break:break-word }
  .panel{ padding:12px 14px; display:flex; gap:8px; align-items:center; justify-content:space-between; border-top:1px solid var(--border) }
  .err{ color:#b00020; font-size:13px }
  .muted{ color:var(--muted); font-size:12px }

  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0b0f; --fg:#f2f2f7; --card:#16161a; --border:rgba(255,255,255,.08); --muted:#9b9ba1 }
    .scan-btn{ background:linear-gradient(180deg,#1f1f25,#18181c); color:#f2f2f7 }
    .xbtn,.mini{ background:#1c1c21; color:#f2f2f7; border-color:var(--border) }
  }
</style>

<body>
  <div class="wrap" role="main">
    <h1>二维码扫描</h1>
    <div class="sub">苹果风 · 中央大按钮 · 弹窗扫码 · PWA</div>
    <button class="scan-btn" id="openScan" aria-label="开始扫描">扫描</button>
  </div>

  <!-- 弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog" aria-label="扫码">
    <div class="backdrop" id="backdrop"></div>
    <div class="sheet">
      <header>
        <div class="title">扫描二维码</div>
        <div style="display:flex;gap:8px">
          <button class="mini" id="toggleCam">开始</button>
          <button class="xbtn" id="close">完成</button>
        </div>
      </header>

      <div class="stage">
        <video id="v" playsinline muted></video>
        <div class="mask" id="mask"><div class="box"></div></div>
      </div>

      <div class="res" id="res">
        <strong>结果</strong>
        <pre id="text"></pre>
        <div style="display:flex; gap:8px; margin-top:8px">
          <button class="mini" id="copy">复制</button>
          <a class="mini primary" id="open" target="_blank" rel="noreferrer" style="display:none">打开链接</a>
          <button class="mini" id="again">继续扫描</button>
        </div>
      </div>

      <div class="panel">
        <div class="err" id="err"></div>
        <small class="muted" id="hint">首次使用需要允许相机权限</small>
      </div>
    </div>
  </div>

  <!-- jsQR：首次加载后将被 SW 缓存。若要完全离线，把此外链换成内联源码即可 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    // 简易 PWA 注册
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const $=id=>document.getElementById(id);
    const modal=$("modal"), openScan=$("openScan"), closeBtn=$("close"),
          backdrop=$("backdrop"), toggleCam=$("toggleCam"),
          v=$("v"), mask=$("mask"), err=$("err"), hint=$("hint"),
          res=$("res"), text=$("text"), copyBtn=$("copy"),
          again=$("again"), openLink=$("open");

    let stream=null, raf=null, scanning=false;
    const cvs=document.createElement("canvas"), ctx=cvs.getContext("2d");

    const showModal=()=>{ modal.classList.add("show"); navigator.vibrate?.(10); };
    const hideModal=()=>{ stop(); modal.classList.remove("show"); res.style.display="none"; text.textContent=""; openLink.style.display="none"; };

    const showErr=m=>{ err.textContent=m||""; };
    const vib=(pattern)=>{ try{ navigator.vibrate?.(pattern); }catch{} }

    const start=async()=>{
      showErr(""); hint.textContent="正在打开相机…";
      try{
        stream=await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} }, audio:false
        });
      }catch(e){
        const n=e?.name||"";
        showErr(n==="NotAllowedError"?"相机权限被拒绝，请在浏览器设置里允许相机访问。"
              :n==="NotFoundError"?"未找到可用摄像头。"
              :"需要 HTTPS 或 localhost 才能开启相机。");
        vib([30,40,30]); // 错误震动
        return;
      }
      v.srcObject=stream; await v.play();
      scanning=true; mask.style.display="flex"; toggleCam.textContent="停止"; toggleCam.classList.add("primary");
      hint.textContent="对准二维码即可识别";
      vib(15); // 开始扫描轻微震动
      loop();
    };

    const stop=()=>{
      if(raf) cancelAnimationFrame(raf); raf=null;
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
      scanning=false; mask.style.display="none"; toggleCam.textContent="开始"; toggleCam.classList.remove("primary");
      hint.textContent="首次使用需要允许相机权限";
    };

    const loop=()=>{
      if(!scanning) return;
      if(v.readyState>=2 && v.videoWidth){
        const vw=v.videoWidth, vh=v.videoHeight, s=Math.min(640/Math.min(vw,vh),1);
        const w=Math.round(vw*s), h=Math.round(vh*s);
        cvs.width=w; cvs.height=h; ctx.drawImage(v,0,0,w,h);
        const img=ctx.getImageData(0,0,w,h);
        const code=window.jsQR && jsQR(img.data,img.width,img.height,{inversionAttempts:"attemptBoth"});
        if(code && code.data){ onResult(code.data); return; }
      }
      raf=requestAnimationFrame(loop);
    };

    const onResult=(val)=>{
      stop();
      res.style.display="block";
      text.textContent=val||"";
      const isURL=/^https?:\/\//i.test(val);
      openLink.style.display=isURL?"inline-block":"none";
      if(isURL) openLink.href=val;
      navigator.clipboard?.writeText(val).catch(()=>{});
      hint.textContent="已自动复制到剪贴板";
      vib([8,30,8]); // 成功震动
    };

    // 交互
    openScan.onclick=showModal;
    backdrop.onclick=hideModal; closeBtn.onclick=hideModal;
    toggleCam.onclick=()=> scanning?stop():start();
    again.onclick=()=>{ res.style.display="none"; start(); };
    copyBtn.onclick=async()=>{ try{ await navigator.clipboard.writeText(text.textContent.trim()); hint.textContent="已复制"; vib(10);}catch{} };
    addEventListener("pagehide",stop); addEventListener("beforeunload",stop);
  </script>
</body>
</html>
