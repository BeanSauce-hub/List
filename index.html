<!-- 只识别：QR + 常见一维码（EAN/UPC/CODE128/CODE39/ITF/CODABAR） -->
<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script>
  const $=id=>document.getElementById(id);
  const launch=$('launch'), modal=$('modal'), closeBtn=$('close');
  const video=$('video'), hint=$('hint'), res=$('res'), text=$('text');
  const copyBtn=$('copy'), again=$('again'), openLink=$('open');

  let codeReader=null, running=false, lastDecodeTs=0;

  // 只启用：QR + 条形码（常用制式）
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.QR_CODE,   // 二维码
    ZXing.BarcodeFormat.EAN_13,    // 商品码
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128,  // 物流/票据常用
    ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.ITF,       // Interleaved 2 of 5
    ZXing.BarcodeFormat.CODABAR
    // 如需 Code93，则加：ZXing.BarcodeFormat.CODE_93
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, false); // 关闭重试，提速

  // 后置摄像头 + 中低分辨率（足够识别更快）
  const constraints = {
    video: {
      facingMode: { exact: 'environment' },
      width: { ideal: 720, max: 960 },
      height: { ideal: 480, max: 720 },
      frameRate: { ideal: 24, max: 30 }
    }
  };

  const openModal=()=>{ modal.classList.add('show'); start(); };
  const closeModal=()=>{ stop(); modal.classList.remove('show'); res.style.display='none'; text.textContent=''; openLink.style.display='none'; };
  const showHint=m=>{ hint.textContent=m||''; };

  async function start(){
    showHint('Starting camera…');
    if(!codeReader){ codeReader = new ZXing.BrowserMultiFormatReader(hints); }
    running = true; lastDecodeTs = 0;

    try{
      await codeReader.decodeFromVideoDevice(null, video, onFrame, constraints);
      showHint('Point at a QR / Barcode.');
      enableCameraEnhancements(); // 可选增强：连续对焦/变焦
    }catch(e){
      console.error(e);
      showHint('Camera unavailable. Use HTTPS / allow permission.');
    }
  }

  // 节流：~120ms 解一次码，降低主线程压力
  function onFrame(result, err, controls){
    if(!running) return;
    const now = performance.now();
    if (now - lastDecodeTs < 120) return;
    lastDecodeTs = now;

    if(result){
      onResult(result.getText());
      try{ controls?.stop(); }catch{}
    }else if(err && !(err instanceof ZXing.NotFoundException)){
      // 其它错误忽略即可
    }
  }

  function stop(){
    running = false;
    try{ codeReader?.reset(); }catch{}
  }

  function onResult(val){
    stop();
    res.style.display='block';
    text.textContent = val || '';
    const isURL = /^https?:\/\//i.test(val);
    openLink.style.display = isURL ? 'inline-block' : 'none';
    if(isURL) openLink.href = val;
    navigator.clipboard?.writeText(val).catch(()=>{});
    showHint('Result copied to clipboard.');
  }

  // 可选：连续对焦 / 2x 轻变焦（若设备支持）
  async function enableCameraEnhancements(){
    try{
      const track = video.srcObject?.getVideoTracks?.()[0];
      const caps = track?.getCapabilities?.() || {};
      if (caps.focusMode?.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
      if (caps.zoom?.max) {
        const target = Math.min(2, caps.zoom.max);
        await track.applyConstraints({ advanced: [{ zoom: target }] });
      }
    }catch{}
  }

  // 交互
  launch.onclick = openModal;
  closeBtn.onclick = closeModal;
  modal.onclick = e => { if(e.target===modal) closeModal(); };
  again.onclick = () => { res.style.display='none'; start(); };
  copyBtn.onclick = async () => {
    try{ await navigator.clipboard.writeText(text.textContent.trim()); showHint('Copied.'); }catch{}
  };
  addEventListener('pagehide', stop);
  addEventListener('beforeunload', stop);
</script>
