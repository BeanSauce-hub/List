<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR 扫码（精简版）</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,Segoe UI,Roboto;display:flex;min-height:100vh;flex-direction:column;align-items:center;gap:12px;padding:16px}
  h1{font-size:18px;margin:8px 0}
  #stage{position:relative;width:min(480px,100%);aspect-ratio:9/16;background:#eee;border-radius:12px;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover}
  #box{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
  #box div{width:220px;height:220px;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.3)}
  button{padding:10px 16px;border-radius:999px;border:0;background:#059669;color:#fff;font-weight:600}
  button.stop{background:#dc2626}
  #err{color:#b91c1c;font-size:14px;display:none}
  #res{display:none;width:min(480px,100%);border:1px solid #e5e7eb;border-radius:12px;padding:10px}
  #res .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #res pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
  .sm{font-size:13px;padding:6px 10px;border:1px solid #e5e7eb;background:#fff;color:#111;border-radius:10px}
  a.btn{display:inline-block;text-decoration:none;background:#111;color:#fff;border-radius:10px;padding:8px 12px}
</style>

<body>
  <h1>二维码扫描</h1>

  <div id="stage">
    <video id="v" playsinline muted></video>
    <div id="box"><div></div></div>
  </div>

  <button id="toggle">开始扫描</button>
  <div id="err"></div>

  <div id="res">
    <div class="row">
      <strong>结果</strong>
      <div>
        <button class="sm" id="copy">复制</button>
        <button class="sm" id="again">继续扫描</button>
      </div>
    </div>
    <pre id="text"></pre>
    <div id="actions" style="margin-top:8px;display:none">
      <a id="open" class="btn" target="_blank" rel="noreferrer">打开链接</a>
    </div>
  </div>

  <!-- jsQR：如需离线，把此外链替换为内联源码 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const $ = (id)=>document.getElementById(id);
    const v=$("v"), toggle=$("toggle"), err=$("err"), box=$("box");
    const res=$("res"), text=$("text"), copyBtn=$("copy"), again=$("again");
    const actions=$("actions"), open=$("open");
    let stream=null, raf=null, scanning=false;
    const cvs=document.createElement("canvas"), ctx=cvs.getContext("2d");

    const showErr=m=>{err.textContent=m||"";err.style.display=m?"block":"none"};
    const stop=()=>{ if(raf)cancelAnimationFrame(raf); raf=null;
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
      scanning=false; box.style.display="none"; toggle.textContent="开始扫描"; toggle.classList.remove("stop");
    };
    const onResult=async (val)=>{
      stop();
      text.textContent=val||"";
      res.style.display="block";
      const isURL=/^https?:\/\//i.test(val);
      actions.style.display=isURL?"block":"none";
      if(isURL) open.href=val;
      try{ await navigator.clipboard.writeText(val);}catch{}
    };

    async function start(){
      showErr("");
      try{
        stream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}, audio:false
        });
      }catch(e){
        const n=e?.name||"";
        showErr(n==="NotAllowedError"?"相机权限被拒绝，请在浏览器设置里允许相机访问。"
              :n==="NotFoundError"?"未找到可用摄像头。"
              :"需要 HTTPS 或 localhost 才能开启相机。");
        return;
      }
      v.srcObject=stream; await v.play();
      scanning=true; box.style.display="flex"; toggle.textContent="停止"; toggle.classList.add("stop");
      loop();
    }

    function loop(){
      if(!scanning) return;
      if(v.readyState>=2 && v.videoWidth){
        const vw=v.videoWidth, vh=v.videoHeight, s=Math.min(640/Math.min(vw,vh),1);
        const w=Math.round(vw*s), h=Math.round(vh*s);
        cvs.width=w; cvs.height=h; ctx.drawImage(v,0,0,w,h);
        const img=ctx.getImageData(0,0,w,h);
        const code=window.jsQR&&jsQR(img.data,img.width,img.height,{inversionAttempts:"attemptBoth"});
        if(code && code.data){ onResult(code.data); return; }
      }
      raf=requestAnimationFrame(loop);
    }

    toggle.onclick=()=> scanning?stop():start();
    again.onclick=()=>{res.style.display="none"; start();};
    copyBtn.onclick=async()=>{ try{ await navigator.clipboard.writeText(text.textContent.trim()); }catch{} };

    // 清理
    addEventListener("pagehide",stop); addEventListener("beforeunload",stop);
  </script>
</body>
</html>
