<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SmartScan</title>

<style>
:root{
--bg:#0e0f12;
--fg:#e7e9ee;
--muted:#9aa1ad;
--card:#14161c;
--border:rgba(255,255,255,.12);
--btn:#e6372a;
--btn-press:#c82f24;
--ring:#0a84ff;
--danger:#ff4d4f;
--tap:44px;
--colw:320px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
background:var(--bg);
color:var(--fg);
min-height:100svh;
font:16px/1.5 ui-sans-serif,system-ui,-apple-system;
}

.wrap{
width:100%;
max-width:1000px;
margin:0 auto;
padding:18px 4vw;
display:flex;
flex-direction:column;
gap:12px
}

#landing{
position:fixed;
inset:0;
z-index:1000;
display:flex;
align-items:center;
justify-content:center;
background:var(--bg);
}

.start{
width:240px;
height:240px;
border-radius:50%;
display:grid;
place-items:center;
cursor:pointer;
background:var(--btn);
color:#fff;
font-weight:900;
font-size:32px;
border:none;
}

#app{display:none}

.topbar{
display:flex;
justify-content:flex-end;
gap:8px
}

.btn{
appearance:none;
border:1px solid var(--border);
background:#1a1d25;
color:#e7e9ee;
padding:8px 12px;
border-radius:10px;
font-size:14px;
cursor:pointer
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
overflow:hidden
}

.thead,.tbody{
display:flex;
gap:8px;
padding:10px 12px;
overflow-x:auto
}

.thead{
border-bottom:1px solid var(--border)
}

.head-cell{
min-width:var(--colw);
max-width:var(--colw);
display:flex;
align-items:center;
gap:8px
}

.head-edit{
flex:1;
padding:6px 8px;
border-radius:8px;
background:transparent;
color:#fff;
outline:none
}

.del-col,.add-col{
width:36px;
height:36px;
border-radius:10px;
display:grid;
place-items:center;
cursor:pointer;
background:#1a1d25;
border:1px solid var(--border)
}

.col{
min-width:var(--colw);
max-width:var(--colw);
display:flex;
flex-direction:column;
gap:8px
}

.trow{
display:grid;
grid-template-columns:1fr 44px;
gap:8px;
border:1px solid var(--border);
border-radius:12px;
padding:8px 10px;
background:#14161c
}

.cell input{
width:100%;
background:transparent;
border:none;
color:#fff;
font:inherit;
padding:6px
}

.clear-btn{
width:44px;
height:44px;
border-radius:12px;
border:1.5px solid var(--danger);
background:transparent;
display:grid;
place-items:center;
cursor:pointer
}

.placeholder .plus-full{
width:100%;
height:44px;
border-radius:10px;
border:1px dashed #3a3f4b;
background:#1a1d25;
color:#fff;
display:grid;
place-items:center;
font-weight:800
}
</style>

<body>

<div class="wrap">

<section id="landing">
<button class="start" id="startBtn">START</button>
</section>

<section id="app">

<div class="topbar">
<button class="btn" id="copyAll">Copy All</button>
<button class="btn" id="exportXlsx">Export Sheet</button>
</div>

<div class="card">
<div class="thead" id="thead"></div>
<div class="tbody" id="tbody"></div>
</div>

</section>
</div>

<div class="modal" id="modal" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,.55);padding:10px">

<div style="width:min(92vw,520px);margin:auto;background:#12131a;border-radius:14px">

<div style="display:flex;justify-content:flex-end;padding:10px">
<button class="btn" id="close">Close</button>
</div>

<div style="background:#000;height:54svh">
<video id="video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
</div>

</div>
</div>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

const $=id=>document.getElementById(id)

const startBtn=$('startBtn')
const landing=$('landing')
const app=$('app')

const thead=$('thead')
const tbody=$('tbody')

const exportBtn=$('exportXlsx')
const copyAllBtn=$('copyAll')

const columns=[]

startBtn.onclick=()=>{
landing.remove()
app.style.display='block'
if(columns.length===0) addColumn('Code')
}

function addColumn(title='Column'){

const head=document.createElement('div')
head.className='head-cell'

const t=document.createElement('div')
t.className='head-edit'
t.contentEditable='true'
t.textContent=title

const del=document.createElement('button')
del.className='del-col'
del.textContent='×'

del.onclick=()=>deleteColumn(head)

head.appendChild(t)
head.appendChild(del)

thead.appendChild(head)

const col=document.createElement('div')
col.className='col'

tbody.appendChild(col)

appendPlaceholder(col)

columns.push({titleEl:t,headCell:head,colBody:col})

refreshAddColBtn()
}

function deleteColumn(h){

const i=columns.findIndex(c=>c.headCell===h)
if(i<0)return

columns[i].headCell.remove()
columns[i].colBody.remove()

columns.splice(i,1)

refreshAddColBtn()
}

function refreshAddColBtn(){

thead.querySelectorAll('.add-col').forEach(b=>b.remove())

if(columns.length){

const last=columns.at(-1).headCell

const add=document.createElement('button')
add.className='add-col'
add.textContent='＋'

add.onclick=()=>addColumn(`Col ${columns.length+1}`)

last.appendChild(add)
}
}

function makeDataRow(value=''){

const r=document.createElement('div')
r.className='trow'

const c=document.createElement('div')
c.className='cell'

const input=document.createElement('input')
input.value=value

c.appendChild(input)

const del=document.createElement('button')
del.className='clear-btn'
del.textContent='×'

del.onclick=()=>r.remove()

r.appendChild(c)
r.appendChild(del)

return r
}

function appendPlaceholder(col){

const ph=document.createElement('div')
ph.className='placeholder'

const btn=document.createElement('button')
btn.className='plus-full'
btn.textContent='+ Scan & Add'

ph.appendChild(btn)
col.appendChild(ph)

btn.onclick=()=>{
targetCol=col
openModalAndScan()
}
}

function addValueToColumn(col,val){

const last=col.lastElementChild
const row=makeDataRow(val)

col.insertBefore(row,last)
}

exportBtn.onclick=()=>{

const headers=columns.map(c=>c.titleEl.innerText)

const maxRows=Math.max(...columns.map(c=>c.colBody.querySelectorAll('.trow').length))

const data=[headers]

for(let r=0;r<maxRows;r++){

const row=columns.map(c=>{

const trs=c.colBody.querySelectorAll('.trow')

return trs[r]?.querySelector('input')?.value||''
})

data.push(row)
}

const ws=XLSX.utils.aoa_to_sheet(data)
const wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,'Sheet1')

XLSX.writeFile(wb,'sheet.xlsx')
}

copyAllBtn.onclick=()=>{

const headers=columns.map(c=>c.titleEl.innerText)

const maxRows=Math.max(...columns.map(c=>c.colBody.querySelectorAll('.trow').length))

const rows=[]

rows.push(headers.join('\t'))

for(let r=0;r<maxRows;r++){

const row=columns.map(c=>{

const trs=c.colBody.querySelectorAll('.trow')

return trs[r]?.querySelector('input')?.value||''
})

rows.push(row.join('\t'))
}

navigator.clipboard.writeText(rows.join('\n'))

alert('Copied to clipboard')
}

const modal=$('modal')
const closeBtn=$('close')
const video=$('video')

let codeReader=null
let targetCol=null

function openModalAndScan(){

modal.style.display='flex'

if(!codeReader) codeReader=new ZXing.BrowserMultiFormatReader()

codeReader.decodeFromConstraints(

{video:{facingMode:'environment'}},

video,

(result,err)=>{

if(result){

addValueToColumn(targetCol||columns[0].colBody,result.getText())

closeModal()
}
})
}

function closeModal(){

try{codeReader.reset()}catch{}

modal.style.display='none'
}

closeBtn.onclick=closeModal

</script>

</body>
</html>
