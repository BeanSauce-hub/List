<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Universal Scanner · Light</title>
<style>
  :root{
    --bg:#f8f9fb; --fg:#1b1c1f; --muted:#70757e; --border:rgba(0,0,0,.12);
    --btn:#e6372a; --btn-press:#c82f24; --ring:#0a84ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top)+6svh) 4vw calc(env(safe-area-inset-bottom)+6svh);
    font:16px/1.5 system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial;
    -webkit-font-smoothing:antialiased;
  }

  /* 主界面仅一个圆形红色按钮（扁平化） */
  .launch{
    width:120px; height:120px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer; user-select:none;
    background:var(--btn); color:#fff;
    font-weight:800; font-size:18px; letter-spacing:.05em;
    border:none;
    transition:transform .06s ease, background-color .06s ease, box-shadow .06s ease;
  }
  .launch:active{ transform:translateY(1px); background:var(--btn-press); }
  .launch:focus-visible{ outline:none; box-shadow:0 0 0 4px color-mix(in srgb,var(--ring) 35%,transparent); }

  /* 弹窗（无取景框 HUD，极简） */
  .modal{ position:fixed; inset:0; display:none; z-index:50; background:rgba(0,0,0,.35);
          padding:calc(env(safe-area-inset-top)+10px) 12px calc(env(safe-area-inset-bottom)+10px); }
  .modal.show{ display:flex; align-items:center; justify-content:center; }
  .sheet{
    width:min(92vw,520px); max-height:min(82svh,82dvh);
    background:#fff; border:1px solid var(--border); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .bar{ display:flex; justify-content:flex-end; padding:10px 12px; border-bottom:1px solid var(--border); }
  .x{ appearance:none; border:1px solid var(--border); background:#f5f6f7; color:var(--fg);
      border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .stage{ position:relative; background:#000; height:clamp(240px,54svh,520px); }
  video{ width:100%; height:100%; object-fit:cover; }

  .res{ padding:12px; border-top:1px solid var(--border); display:none; color:#222; }
  .res pre{ margin-top:6px; white-space:pre-wrap; word-break:break-word; font-size:14px; max-height:22svh; overflow:auto; }
  .actions{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ border:1px solid var(--border); background:#f5f6f7; color:#111; border-radius:8px; padding:6px 12px; font-size:13px; text-decoration:none; }
  .btn.primary{ background:var(--ring); color:#fff; border:none; }
  .hint{ padding:10px 12px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; text-align:center; }
</style>

<body>
  <!-- 主界面：只有圆形红色按钮 -->
  <button class="launch" id="launch">SCAN</button>

  <!-- 扫码弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog">
    <div class="sheet">
      <div class="bar"><button class="x" id="close">Close</button></div>
      <div class="stage"><video id="video" playsinline muted></video></div>
      <div class="res" id="res">
        <pre id="text"></pre>
        <div class="actions">
          <button class="btn" id="copy">Copy</button>
          <a class="btn primary" id="open" target="_blank" rel="noreferrer" style="display:none">Open Link</a>
          <button class="btn" id="again">Scan Again</button>
        </div>
      </div>
      <div class="hint" id="hint">Allow camera access to start scanning.</div>
    </div>
  </div>

  <!-- ZXing 多码制识别库 -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script>
    const $=id=>document.getElementById(id);
    const launch=$('launch'), modal=$('modal'), closeBtn=$('close');
    const video=$('video'), hint=$('hint'), res=$('res'), text=$('text');
    const copyBtn=$('copy'), again=$('again'), openLink=$('open');

    let codeReader=null, running=false, lastDecodeTs=0;

    /* 只启用：二维码 + 常见条形码（更快更稳） */
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.QR_CODE,   // 二维码
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
      // 如需 Code93：ZXing.BarcodeFormat.CODE_93
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, false);

    /* 后置摄像头 + 中低分辨率 + 限帧（更流畅省电） */
    const constraints = {
      video: {
        facingMode: { exact: 'environment' },
        width: { ideal: 720, max: 960 },
        height: { ideal: 480, max: 720 },
        frameRate: { ideal: 24, max: 30 }
      }
    };

    const openModal=()=>{ modal.classList.add('show'); start(); };
    const closeModal=()=>{ stop(); modal.classList.remove('show'); res.style.display='none'; text.textContent=''; openLink.style.display='none'; };
    const showHint=m=>{ hint.textContent=m||''; };

    async function start(){
      showHint('Starting camera…');
      if(!codeReader){ codeReader = new ZXing.BrowserMultiFormatReader(hints); }
      running = true; lastDecodeTs = 0;

      try{
        await codeReader.decodeFromVideoDevice(null, video, onFrame, constraints);
        showHint('Point at a QR / Barcode.');
        // 启动后启用连续对焦（若支持），并轻微变焦
        await enableContinuousFocus(video, { zoom: 1.8 });
      }catch(e){
        console.error(e);
        showHint('Camera unavailable. Try HTTPS / allow permission.');
      }
    }

    // 节流：每 ~120ms 解一次码，避免主线程过载
    function onFrame(result, err, controls){
      if(!running) return;
      const now = performance.now();
      if (now - lastDecodeTs < 120) return;
      lastDecodeTs = now;

      if(result){
        onResult(result.getText());
        try{ controls?.stop(); }catch{}
      }else if(err && !(err instanceof ZXing.NotFoundException)){
        // 其它错误忽略
      }
    }

    function stop(){
      running = false;
      try{ codeReader?.reset(); }catch{}
    }

    function onResult(val){
      stop();
      res.style.display='block';
      text.textContent = val || '';
      const isURL = /^https?:\/\//i.test(val);
      openLink.style.display = isURL ? 'inline-block' : 'none';
      if(isURL) openLink.href = val;
      navigator.clipboard?.writeText(val).catch(()=>{});
      showHint('Result copied to clipboard.');
    }

    /* 连续对焦（可选变焦）；设备不支持时静默跳过 */
    async function enableContinuousFocus(videoEl, { zoom = 1.8 } = {}){
      try{
        const stream = videoEl.srcObject;
        if(!stream) return;
        const track = stream.getVideoTracks?.()[0];
        if(!track?.getCapabilities) return;

        const caps = track.getCapabilities();
        const cons = { advanced: [] };

        if (Array.isArray(caps.focusMode)) {
          if (caps.focusMode.includes('continuous')) {
            cons.advanced.push({ focusMode: 'continuous' });
          } else if (caps.focusMode.includes('auto')) {
            cons.advanced.push({ focusMode: 'auto' });
          }
        }
        if (caps.zoom && typeof caps.zoom.max === 'number') {
          const target = Math.min(zoom, caps.zoom.max);
          if (target > (caps.zoom.min ?? 1)) cons.advanced.push({ zoom: target });
        }
        // 某些设备没有 focusMode，但有 focusDistance，可尝试中值
        if (!cons.advanced.length && typeof caps.focusDistance?.min === 'number' && typeof caps.focusDistance?.max === 'number') {
          const mid = (caps.focusDistance.min + caps.focusDistance.max) / 2;
          cons.advanced.push({ focusDistance: mid });
        }
        if (cons.advanced.length) await track.applyConstraints(cons);

        // 页面恢复可见时，重新应用一次（有些浏览器会丢设置）
        document.addEventListener('visibilitychange', async () => {
          if (!document.hidden) {
            try{ await track.applyConstraints(cons); }catch{}
          }
        });
      }catch(e){
        // 不支持则忽略
      }
    }

    // 交互
    launch.onclick = openModal;
    closeBtn.onclick = closeModal;
    modal.onclick = e => { if(e.target===modal) closeModal(); };
    again.onclick = () => { res.style.display='none'; start(); };
    copyBtn.onclick = async () => { try{ await navigator.clipboard.writeText(text.textContent.trim()); showHint('Copied.'); }catch{} };
    addEventListener('pagehide', stop);
    addEventListener('beforeunload', stop);
  </script>
</body>
</html>
