<!-- ZXing：多码制识别（QR + 一维码） -->
<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script>
  const $=id=>document.getElementById(id);
  const launch=$('launch'), modal=$('modal'), closeBtn=$('close');
  const video=$('video'), hint=$('hint'), res=$('res'), text=$('text');
  const copyBtn=$('copy'), again=$('again'), openLink=$('open');

  let codeReader=null, running=false, lastDecodeTs=0;

  // 只启用：QR + 常见条形码（更快）
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.QR_CODE,
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, false); // 关闭深度重试，提速

  // 后置摄像头 + 中低分辨率 + 限帧（速度/耗电的甜点位）
  const constraints = {
    video: {
      facingMode: { exact: 'environment' },
      width:  { ideal: 720, max: 960 },
      height: { ideal: 480, max: 720 },
      frameRate: { ideal: 24, max: 30 }
    }
  };

  const openModal=()=>{ modal.classList.add('show'); start(); };
  const closeModal=()=>{ stop(); modal.classList.remove('show'); res.style.display='none'; text.textContent=''; openLink.style.display='none'; };
  const showHint=m=>{ hint.textContent=m||''; };

  async function start(){
    showHint('Starting camera…');
    if(!codeReader){ codeReader = new ZXing.BrowserMultiFormatReader(hints); }
    running = true; lastDecodeTs = 0;

    try{
      // 用 constraints 版本，显式要求后摄/分辨率/帧率
      await codeReader.decodeFromConstraints(
        constraints,
        video,
        onFrame
      );
      showHint('Point at a QR / Barcode.');
      // 成功拉流后，尝试连续对焦 + 轻微变焦（若设备支持）
      await enableContinuousFocus(video, { zoom: 1.8 });
    }catch(e){
      console.error(e);
      showHint('Camera unavailable. Use HTTPS / allow permission.');
    }
  }

  // 节流：每 ~120ms 解一次码，避免主线程过载
  function onFrame(result, err, controls){
    if(!running) return;
    const now = performance.now();
    if (now - lastDecodeTs < 120) return;
    lastDecodeTs = now;

    if(result){
      onResult(result.getText());
      try{ controls?.stop(); }catch{}
    }else if(err && !(err instanceof ZXing.NotFoundException)){
      // 其它错误忽略
    }
  }

  function stop(){
    running = false;
    try{ codeReader?.reset(); }catch{}
  }

  function onResult(val){
    stop();
    res.style.display='block';
    text.textContent = val || '';
    const isURL = /^https?:\/\//i.test(val);
    openLink.style.display = isURL ? 'inline-block' : 'none';
    if(isURL) openLink.href = val;
    navigator.clipboard?.writeText(val).catch(()=>{});
    showHint('Result copied to clipboard.');
  }

  // 连续对焦（若支持）+ 轻微变焦；不支持则静默
  async function enableContinuousFocus(videoEl, { zoom = 1.8 } = {}){
    try{
      const stream = videoEl.srcObject;
      if(!stream) return;
      const track = stream.getVideoTracks?.()[0];
      if(!track?.getCapabilities) return;

      const caps = track.getCapabilities();
      const adv = [];

      if (Array.isArray(caps.focusMode)) {
        if (caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
        else if (caps.focusMode.includes('auto')) adv.push({ focusMode: 'auto' });
      }
      if (caps.zoom && typeof caps.zoom.max === 'number') {
        const target = Math.min(zoom, caps.zoom.max);
        if (target > (caps.zoom.min ?? 1)) adv.push({ zoom: target });
      }
      if (adv.length) await track.applyConstraints({ advanced: adv });

      // 页面回到前台时，重新应用一次，防止设置丢失
      document.addEventListener('visibilitychange', async () => {
        if (!document.hidden) {
          try{ await track.applyConstraints({ advanced: adv }); }catch{}
        }
      });
    }catch{}
  }

  // 交互
  launch.onclick = openModal;
  closeBtn.onclick = closeModal;
  modal.onclick = e => { if(e.target === modal) closeModal(); };
  again.onclick = () => { res.style.display='none'; start(); };
  copyBtn.onclick = async () => { try{ await navigator.clipboard.writeText(text.textContent.trim()); showHint('Copied.'); }catch{} };

  addEventListener('pagehide', stop);
  addEventListener('beforeunload', stop);
</script>
