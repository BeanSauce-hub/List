<!doctype html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SmartScan</title>

<style>

:root{
--bg:#0e0f12;
--fg:#e7e9ee;
--card:#14161c;
--border:rgba(255,255,255,.12);
--btn:#e6372a;
--danger:#ff4d4f;
--colw:320px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
background:var(--bg);
color:var(--fg);
font:16px system-ui;
}

.wrap{
max-width:1000px;
margin:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:12px
}

#landing{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#0e0f12
}

.start{
width:220px;
height:220px;
border-radius:50%;
border:none;
font-size:32px;
font-weight:700;
background:#e6372a;
color:white
}

#app{display:none}

.topbar{
display:flex;
justify-content:flex-end;
gap:8px
}

.btn{
border:1px solid var(--border);
background:#1a1d25;
color:white;
padding:8px 12px;
border-radius:8px;
cursor:pointer
}

.card{
border:1px solid var(--border);
border-radius:12px;
overflow:hidden
}

.thead,.tbody{
display:flex;
gap:8px;
padding:10px;
overflow-x:auto
}

.thead{
border-bottom:1px solid var(--border)
}

.head-cell{
min-width:var(--colw);
display:flex;
gap:6px
}

.head-edit{
flex:1;
background:transparent;
color:white;
outline:none
}

.col{
min-width:var(--colw);
display:flex;
flex-direction:column;
gap:8px
}

.trow{
display:grid;
grid-template-columns:1fr 44px;
border:1px solid var(--border);
border-radius:10px;
padding:8px
}

.cell input{
width:100%;
background:transparent;
border:none;
color:white
}

.clear-btn{
border:1px solid var(--danger);
border-radius:8px;
background:transparent;
color:var(--danger)
}

.plus-full{
height:44px;
border:1px dashed #444;
background:#1a1d25;
color:white
}

</style>

<body>

<div class="wrap">

<section id="landing">
<button class="start" id="startBtn">START</button>
</section>

<section id="app">

<div class="topbar">
<button class="btn" id="copyAll">Copy All</button>
<button class="btn" id="exportXlsx">Export Sheet</button>
</div>

<div class="card">
<div class="thead" id="thead"></div>
<div class="tbody" id="tbody"></div>
</div>

</section>

</div>

<div id="modal" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,.6)">
<div style="width:min(520px,90vw);margin:auto;margin-top:40px;background:#12131a">

<div style="padding:10px;text-align:right">
<button class="btn" id="close">Close</button>
</div>

<div style="height:55vh;background:black">
<video id="video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
</div>

</div>
</div>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

const $=id=>document.getElementById(id)

const startBtn=$("startBtn")
const landing=$("landing")
const app=$("app")

const thead=$("thead")
const tbody=$("tbody")

const copyAllBtn=$("copyAll")
const exportBtn=$("exportXlsx")

const columns=[]

let codeReader=null
let scanLock=false
let targetCol=null

startBtn.onclick=()=>{
landing.remove()
app.style.display="block"
addColumn("Code")
}

function updateColumnCount(colObj){

const count=colObj.colBody.querySelectorAll(".trow").length
const baseTitle=colObj.titleEl.dataset.base||colObj.titleEl.innerText

colObj.titleEl.dataset.base=baseTitle.replace(/\(\d+\)$/,'')

colObj.titleEl.innerText=`${colObj.titleEl.dataset.base} (${count})`
}

function addColumn(title){

const head=document.createElement("div")
head.className="head-cell"

const edit=document.createElement("div")
edit.className="head-edit"
edit.contentEditable=true
edit.innerText=title
edit.dataset.base=title

head.appendChild(edit)

thead.appendChild(head)

const col=document.createElement("div")
col.className="col"

tbody.appendChild(col)

appendPlaceholder(col)

columns.push({titleEl:edit,headCell:head,colBody:col})
}

function appendPlaceholder(col){

const btn=document.createElement("button")
btn.className="plus-full"
btn.textContent="+ Scan"

btn.onclick=()=>{
targetCol=col
openScanner()
}

col.appendChild(btn)
}

function makeRow(val,colObj){

const r=document.createElement("div")
r.className="trow"

const c=document.createElement("div")
c.className="cell"

const input=document.createElement("input")
input.value=val

c.appendChild(input)

const del=document.createElement("button")
del.className="clear-btn"
del.textContent="x"

del.onclick=()=>{
r.remove()
updateColumnCount(colObj)
}

r.appendChild(c)
r.appendChild(del)

return r
}

function addValueToColumn(col,val){

const colObj=columns.find(c=>c.colBody===col)

const row=makeRow(val,colObj)

col.insertBefore(row,col.lastElementChild)

if(col.children.length>500){
col.removeChild(col.children[0])
}

updateColumnCount(colObj)

}

copyAllBtn.onclick=()=>{

let text=""
let total=0

columns.forEach((col,i)=>{

const title=(col.titleEl.dataset.base||`Col ${i+1}`).trim()

const rows=col.colBody.querySelectorAll(".trow")

if(rows.length===0) return

text+=`${title} (${rows.length})\n`

rows.forEach(r=>{
const val=r.querySelector("input")?.value||""
if(val){
text+=val+"\n"
total++
}
})

text+="\n"

})

text+=`TOTAL: ${total}`

navigator.clipboard.writeText(text)

}

exportBtn.onclick=()=>{

const headers=columns.map(c=>c.titleEl.dataset.base)

const maxRows=Math.max(...columns.map(c=>c.colBody.querySelectorAll(".trow").length))

const data=[headers]

for(let r=0;r<maxRows;r++){

const row=columns.map(c=>{
const trs=c.colBody.querySelectorAll(".trow")
return trs[r]?.querySelector("input")?.value||""
})

data.push(row)
}

const ws=XLSX.utils.aoa_to_sheet(data)
const wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,"Sheet1")

XLSX.writeFile(wb,"sheet.xlsx")

}

const modal=$("modal")
const video=$("video")
const closeBtn=$("close")

function openScanner(){

modal.style.display="block"

const hints=new Map()
hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128])

codeReader=new ZXing.BrowserMultiFormatReader(hints)

codeReader.decodeFromConstraints(

{video:{facingMode:"environment"}},

video,

(result,err)=>{

if(result && !scanLock){

scanLock=true

const val=result.getText()

addValueToColumn(targetCol||columns[0].colBody,val)

setTimeout(()=>{
closeScanner()
scanLock=false
},300)

}

}

)

}

function closeScanner(){

try{

const stream=video.srcObject

if(stream){
stream.getTracks().forEach(t=>t.stop())
}

video.srcObject=null
codeReader=null

}catch{}

modal.style.display="none"

}

closeBtn.onclick=closeScanner

</script>

</body>
</html>
