<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>移动扫描宝</title>

<style>
:root{
  --bg1:#f6f7fb;
  --bg2:#eef2f8;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --line:rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.56);
  --glass-strong:rgba(255,255,255,.72);
  --shadow:0 10px 30px rgba(28,39,58,.10);
  --shadow-soft:0 6px 18px rgba(28,39,58,.08);
  --blue1:#0a84ff;
  --blue2:#5ac8fa;
  --red1:#ff5f6d;
  --red2:#ff7a59;
  --success:#30d158;
  --danger:#ff3b30;
  --radius:18px;
  --safe-bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(80vw 50vh at 10% 0%, rgba(255,95,109,.18), transparent 55%),
    radial-gradient(70vw 50vh at 100% 10%, rgba(10,132,255,.20), transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  overflow:hidden;
}

button,input{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

.header{
  padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
  position:relative;
  z-index:5;
}

.glass-panel{
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:var(--shadow);
}

.hero{
  border-radius:24px;
  padding:14px 14px 12px;
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.title{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.02em;
}

.subtitle{
  font-size:13px;
  color:var(--muted);
}

.count-pill{
  min-width:74px;
  height:38px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 14px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow-soft);
  font-size:14px;
  font-weight:700;
}

.column-chip{
  margin-top:12px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  max-width:100%;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.48);
  box-shadow:var(--shadow-soft);
}

.column-chip span{
  font-size:15px;
  font-weight:700;
}

.column-name{
  outline:none;
  border:none;
  background:transparent;
  min-width:0;
  max-width:56vw;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.list-wrap{
  flex:1;
  min-height:0;
  padding:8px 16px calc(164px + var(--safe-bottom));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

.list-wrap::-webkit-scrollbar{display:none}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.empty-state{
  padding:18px 16px;
  border-radius:22px;
  background:rgba(255,255,255,.40);
  backdrop-filter:blur(14px) saturate(130%);
  -webkit-backdrop-filter:blur(14px) saturate(130%);
  border:1px solid rgba(255,255,255,.38);
  box-shadow:var(--shadow-soft);
}

.empty-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:4px;
}

.empty-text{
  font-size:14px;
  color:var(--muted);
  line-height:1.45;
}

.trow{
  display:grid;
  grid-template-columns:1fr 42px;
  gap:10px;
  align-items:center;
  padding:12px 12px 12px 14px;
  border-radius:20px;
  background:var(--glass-strong);
  backdrop-filter:blur(16px) saturate(145%);
  -webkit-backdrop-filter:blur(16px) saturate(145%);
  border:1px solid rgba(255,255,255,.46);
  box-shadow:var(--shadow-soft);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.trow.flash{
  border-color:rgba(48,209,88,.85);
  box-shadow:
    0 0 0 3px rgba(48,209,88,.18),
    0 10px 24px rgba(48,209,88,.10);
  transform:translateY(-1px);
}

.cell{
  min-width:0;
}

.cell input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:16px;
  font-weight:650;
  letter-spacing:.01em;
}

.clear-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:rgba(255,59,48,.10);
  color:var(--danger);
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.clear-btn:active{
  transform:scale(.96);
}

.floating{
  position:fixed;
  left:16px;
  right:16px;
  bottom:var(--safe-bottom);
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.scan-btn{
  height:62px;
  border:none;
  border-radius:22px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  letter-spacing:.01em;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  box-shadow:0 16px 34px rgba(10,132,255,.30);
  cursor:pointer;
}

.scan-btn:active{
  transform:translateY(1px) scale(.992);
}

.scan-btn.scanning{
  background:linear-gradient(135deg,#4f8cff,#77d4ff);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  height:48px;
  border:none;
  border-radius:18px;
  background:var(--glass);
  backdrop-filter:blur(16px) saturate(145%);
  -webkit-backdrop-filter:blur(16px) saturate(145%);
  border:1px solid rgba(255,255,255,.44);
  box-shadow:var(--shadow-soft);
  color:var(--text);
  font-size:15px;
  font-weight:750;
  cursor:pointer;
}

.btn.success{
  background:rgba(48,209,88,.92);
  color:#fff;
  border-color:rgba(48,209,88,.94);
}

.btn:active{
  transform:translateY(1px) scale(.992);
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(22,24,31,.22);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:40;
}

.sheet{
  width:100%;
  max-width:680px;
  border-radius:28px 28px 0 0;
  overflow:hidden;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
  border-top:1px solid rgba(255,255,255,.55);
  box-shadow:0 -12px 40px rgba(18,25,38,.14);
}

.sheet-top{
  padding:10px 16px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.grabber{
  width:44px;
  height:5px;
  border-radius:999px;
  background:rgba(60,60,67,.22);
  align-self:center;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.sheet-title{
  font-size:18px;
  font-weight:800;
}

.close-btn{
  min-width:74px;
  height:38px;
  padding:0 14px;
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,.82);
  border:1px solid var(--line);
  font-weight:700;
  cursor:pointer;
}

.stage{
  height:48dvh;
  background:#000;
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
}

#hint{
  padding:12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}

#app{display:none}
#landing{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.start{
  width:184px;
  height:184px;
  border:none;
  border-radius:999px;
  color:#fff;
  font-size:28px;
  font-weight:850;
  letter-spacing:.01em;
  background:linear-gradient(135deg,var(--red1),var(--red2));
  box-shadow:0 20px 46px rgba(255,95,109,.28);
  cursor:pointer;
}

.start:active{
  transform:scale(.97);
}

@media (min-width: 760px){
  .header,.list-wrap,.floating{max-width:760px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>

<div class="app">

  <section id="landing">
    <button class="start" id="startBtn">START</button>
  </section>

  <section id="app">
    <header class="header">
      <div class="hero glass-panel">
        <div class="topline">
          <div class="brand">
            <div class="title">SmartScan</div>
          </div>
          <div class="count-pill" id="countPill">0</div>
        </div>

        <div class="column-chip">
          <span id="columnName" class="column-name" contenteditable="true" spellcheck="false">Column Name</span>
        </div>
      </div>
    </header>

    <main class="list-wrap" id="listWrap">
      <div class="list" id="list"></div>

      <div class="empty-state" id="emptyState">
        <div class="empty-title">Ready to scan</div>
        <div class="empty-text">Tap the large Scan button below. New tracking numbers will appear here and stay scrollable while the action buttons remain floating.</div>
      </div>
    </main>

    <div class="floating">
      <button class="scan-btn" id="scanBtn">SCAN</button>

      <div class="actions">
        <button class="btn" id="copyAll">Copy</button>
        <button class="btn" id="exportXlsx">Export</button>
      </div>
    </div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-top">
      <div class="grabber"></div>
      <div class="sheet-head">
        <div class="sheet-title">Scan package</div>
        <button class="close-btn" id="close">Close</button>
      </div>
    </div>

    <div class="stage">
      <video id="video" playsinline muted></video>
    </div>

    <div id="hint">Allow camera access to start scanning</div>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const $ = id => document.getElementById(id)

const startBtn = $('startBtn')
const landing = $('landing')
const app = $('app')

const list = $('list')
const listWrap = $('listWrap')
const emptyState = $('emptyState')

const scanBtn = $('scanBtn')
const copyBtn = $('copyAll')
const exportBtn = $('exportXlsx')

const modal = $('modal')
const video = $('video')
const hint = $('hint')
const closeBtn = $('close')

const countPill = $('countPill')
const columnName = $('columnName')

let reader = null
let controls = null
let scanning = false
let scanLock = false
let appStarted = false

let scanCooldown = false

const rowsData = []
const seen = new Set()

startBtn.onclick = () => {
  if(appStarted) return
  appStarted = true
  landing.style.display = 'none'
  app.style.display = 'block'
  updateCount()
}

function normalizeValue(v){
  return (v || '').trim()
}

function escapeSheetName(name){
  return normalizeValue(name) || 'Column Name'
}

function updateCount(){
  countPill.textContent = String(rowsData.length)
  emptyState.style.display = rowsData.length ? 'none' : 'block'
}

function makeRow(val){
  const r = document.createElement('div')
  r.className = 'trow'

  const c = document.createElement('div')
  c.className = 'cell'

  const input = document.createElement('input')
  input.value = val
  input.autocomplete = 'off'
  input.autocapitalize = 'off'
  input.spellcheck = false

  c.appendChild(input)

  const del = document.createElement('button')
  del.className = 'clear-btn'
  del.textContent = '×'

  del.onclick = () => {
    const index = rowsData.findIndex(item => item.rowEl === r)
    if(index >= 0){
      rowsData.splice(index, 1)
    }
    r.remove()
    updateCount()
  }

  input.addEventListener('change', () => {
    const newVal = normalizeValue(input.value)
    const item = rowsData.find(x => x.rowEl === r)
    if(!item) return

    if(!newVal){
      seen.delete(item.value)
      const index = rowsData.indexOf(item)
      if(index >= 0) rowsData.splice(index, 1)
      r.remove()
      updateCount()
      return
    }


    seen.delete(item.value)
    item.value = newVal
    seen.add(newVal)
  })

  r.appendChild(c)
  r.appendChild(del)

  return { rowEl:r, inputEl:input }
}

function addValue(val){
  const clean = normalizeValue(val)
  if(!clean) return

  const made = makeRow(clean)
  list.prepend(made.rowEl)

  rowsData.unshift({
    value: clean,
    rowEl: made.rowEl,
    inputEl: made.inputEl
  })

  updateCount()

  made.rowEl.classList.add('flash')
  setTimeout(() => made.rowEl.classList.remove('flash'), 850)

  navigator.vibrate?.(30)
}

function getCurrentValues(){
  return rowsData
    .map(item => normalizeValue(item.inputEl.value))
    .filter(Boolean)
}

function openScan(){

  if(scanCooldown) return

  scanCooldown = true

  setTimeout(()=>{
    scanCooldown = false
  },800)

  modal.style.display = 'flex'
  startScan()
}

function closeModal(){
  stopScan()
  modal.style.display = 'none'
  hint.textContent = 'Allow camera access to start scanning'
  scanBtn.classList.remove('scanning')
  scanBtn.textContent = 'SCAN'
}

async function startScan(){
  if(scanning) return

  scanning = true
  scanLock = false
  hint.textContent = 'Scanning...'
  scanBtn.classList.add('scanning')
  scanBtn.textContent = 'Scanning...'

  try{
    if(!reader){
    reader = new ZXing.BrowserMultiFormatReader()
    }
    reader.timeBetweenDecodingAttempts = 120

    await reader.decodeFromConstraints(
      {
        video:{
          facingMode:'environment',
          width:{ ideal:1280 },
          height:{ ideal:720 }
        }
      },
      video,
      (result, err, c) => {
        controls = c

        if(!scanning) return
        if(!result) return
        if(scanLock) return

        const val = normalizeValue(result.getText())
        if(!val) return

        scanLock = true
        hint.textContent = 'Captured'
        stopScan()
        onScan(val)
      }
    )
  }catch(e){
    hint.textContent = 'Camera failed to start'
    scanning = false
    scanBtn.classList.remove('scanning')
    scanBtn.textContent = 'SCAN'
  }
}

function stopScan(){
  scanning = false

  try{ controls?.stop() }catch{}
  controls = null

  try{ video.pause() }catch{}

  try{
    const stream = video.srcObject
    if(stream) stream.getTracks().forEach(t => t.stop())
  }catch{}

  video.srcObject = null

  try{ reader?.reset() }catch{}
  reader = null
}

function onScan(val){
  addValue(val)
  navigator.clipboard?.writeText(val).catch(() => {})

  setTimeout(() => {
    closeModal()
  }, 180)
}

scanBtn.onclick = openScan
closeBtn.onclick = closeModal

modal.onclick = e => {
  if(e.target === modal) closeModal()
}

copyBtn.onclick = () => {
  const title = escapeSheetName(columnName.innerText)
  const values = getCurrentValues()

  let text = ''
  if(values.length){
    text += `${title} (${values.length})\n`
    values.forEach(v => text += v + '\n')
    text += `\nTOTAL: ${values.length}`
  }else{
    text = `${title} (0)\n\nTOTAL: 0`
  }

  navigator.clipboard?.writeText(text).then(() => {
    copyBtn.classList.add('success')
    copyBtn.textContent = 'Copied'
    setTimeout(() => {
      copyBtn.classList.remove('success')
      copyBtn.textContent = 'Copy'
    }, 1200)
  }).catch(() => {})
}

exportBtn.onclick = () => {
  const title = escapeSheetName(columnName.innerText)
  const values = getCurrentValues()

  const data = [[title], ...values.map(v => [v])]
  const ws = XLSX.utils.aoa_to_sheet(data)
  ws['!cols'] = [{ wch: 26 }]

  const wb = XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1')

  const d = new Date()
  const y = d.getFullYear()
  const m = String(d.getMonth() + 1).padStart(2, '0')
  const day = String(d.getDate()).padStart(2, '0')
  XLSX.writeFile(wb, `SmartScan_${y}-${m}-${day}.xlsx`)
}

addEventListener('pagehide', stopScan)
addEventListener('beforeunload', stopScan)
</script>
</body>
</html>
