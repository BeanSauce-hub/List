<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SmartScan</title>
<style>
  :root{
    --bg:#0e0f12; --fg:#e7e9ee; --muted:#9aa1ad; --card:#14161c; --border:rgba(255,255,255,.12);
    --btn:#e6372a; --btn-press:#c82f24; --ring:#0a84ff; --danger:#ff4d4f;
    --tap:44px; --colw:320px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); min-height:100svh;
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:1000px; margin:0 auto; padding:18px 4vw; display:flex; flex-direction:column; gap:12px}

  /* ✅ START 覆盖层：始终在屏幕正中央 */
  #landing{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); /* 保持与你的背景一致 */
  }
  .start{
    width:240px;height:240px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;user-select:none;
    background:var(--btn);color:#fff;font-weight:900;font-size:32px;letter-spacing:.05em;border:none;
    box-shadow:0 0 40px rgba(230,55,42,.25);
    transition:transform .06s ease,background-color .06s ease;
  }
  .start:active{transform:scale(.98);background:var(--btn-press)}

  /* App */
  #app{display:none}
  .topbar{display:flex;justify-content:flex-end}
  .btn{
    appearance:none; border:1px solid var(--border); background:#1a1d25; color:#e7e9ee;
    padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer;
  }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden }

  .thead,.tbody{ display:flex; gap:8px; padding:10px 12px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin }
  .thead{ border-bottom:1px solid var(--border) }

  .head-cell{ min-width:var(--colw); max-width:var(--colw); display:flex; align-items:center; gap:8px }
  .head-edit{ flex:1; min-height:36px; padding:6px 8px; border-radius:8px; outline:none; border:1px solid transparent; background:transparent; color:#e7e9ee }
  .head-edit:focus{ border-color: color-mix(in srgb,var(--ring) 35%, transparent) }

  .del-col,.add-col{ width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:#1a1d25;border:1px solid var(--border) }
  .del-col svg{width:18px;height:18px;stroke:var(--danger)} .del-col path{stroke-width:2;stroke-linecap:round;fill:none}
  .add-col{font-weight:900;font-size:18px;color:#fff} .add-col:active,.del-col:active{filter:brightness(.95)}

  .col{ min-width:var(--colw); max-width:var(--colw); display:flex; flex-direction:column; gap:8px }

  .trow{ display:grid; grid-template-columns:1fr var(--tap); gap:8px; border:1px solid var(--border); border-radius:12px; padding:8px 10px; background:#14161c }
  .cell input{ width:100%; background:transparent; border:none; color:#fff; font:inherit; padding:6px 6px; border-radius:8px; outline:none }
  .clear-btn{ width:var(--tap); height:var(--tap); border-radius:12px; border:1.5px solid var(--danger); background:transparent; display:grid; place-items:center; cursor:pointer }
  .clear-btn svg{ width:22px; height:22px; stroke:var(--danger) } .clear-btn path{ stroke-width:2; stroke-linecap:round; fill:none }

  .placeholder .plus-full{
    width:100%; height:var(--tap); border-radius:10px; border:1px dashed #3a3f4b;
    background:#1a1d25; color:#fff; display:grid; place-items:center; font-weight:800; font-size:18px;
  }
</style>

<body>
  <div class="wrap">
    <!-- 覆盖层：仅展示 START 按钮 -->
    <section id="landing"><button class="start" id="startBtn">START</button></section>

    <!-- 主应用 -->
    <section id="app" aria-live="polite">
      <div class="topbar"><button class="btn" id="exportXlsx">导出 XLSX</button></div>
      <div class="card">
        <div class="thead" id="thead"></div>
        <div class="tbody" id="tbody"></div>
      </div>
    </section>
  </div>

  <!-- 扫码弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,.55);padding:10px 12px;z-index:50">
    <div class="sheet" style="width:min(92vw,520px);margin:auto;max-height:82svh;background:#12131a;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden">
      <div class="bar" style="display:flex;justify-content:flex-end;padding:10px 12px;border-bottom:1px solid var(--border)">
        <button class="btn" id="close">Close</button>
      </div>
      <div class="stage" style="background:#000;height:54svh">
        <video id="video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      </div>
      <div class="hint" id="hint" style="padding:8px 12px;border-top:1px solid var(--border);color:#9aa1ad;font-size:12.5px;text-align:center">Allow camera access to start scanning.</div>
    </div>
  </div>

  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const $=id=>document.getElementById(id);
    const startBtn=$('startBtn'), landing=$('landing'), app=$('app');
    const thead=$('thead'), tbody=$('tbody'), exportBtn=$('exportXlsx');

    // 表头/内容横向同步
    thead.addEventListener('scroll', ()=>{ tbody.scrollLeft = thead.scrollLeft; }, {passive:true});
    tbody.addEventListener('scroll', ()=>{ thead.scrollLeft = tbody.scrollLeft; }, {passive:true});

    const columns=[];

    // ✅ 点击后彻底移除覆盖层（不会影响后续布局），主界面顶上显示
    startBtn.onclick=()=>{
      landing.remove();
      app.style.display='block';
      if(columns.length===0) addColumn('Code');
    };

    function iconDelete(){
      const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24');
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d','M6 6l12 12M18 6L6 18'); p.setAttribute('stroke','#ff4d4f'); p.setAttribute('stroke-width','2'); p.setAttribute('stroke-linecap','round'); p.setAttribute('fill','none');
      s.appendChild(p); return s;
    }

    function addColumn(title='Column'){
      const head=document.createElement('div'); head.className='head-cell';
      const t=document.createElement('div'); t.className='head-edit'; t.contentEditable='true'; t.spellcheck=false; t.textContent=title;
      const del=document.createElement('button'); del.className='del-col'; del.title='删除该列'; del.appendChild(iconDelete());
      del.onclick=()=>deleteColumn(head);
      head.appendChild(t); head.appendChild(del); thead.appendChild(head);

      const col=document.createElement('div'); col.className='col'; tbody.appendChild(col);
      appendPlaceholder(col);

      columns.push({ titleEl:t, headCell:head, colBody:col });
      refreshAddColBtn();
    }

    function deleteColumn(headCell){
      const idx=columns.findIndex(c=>c.headCell===headCell);
      if(idx<0) return;
      const hasData = columns[idx].colBody.querySelector('.trow');
      if(hasData && !confirm('该列包含数据，确定删除？')) return;
      columns[idx].headCell.remove();
      columns[idx].colBody.remove();
      columns.splice(idx,1);
      refreshAddColBtn();
    }

    function refreshAddColBtn(){
      thead.querySelectorAll('.add-col').forEach(b=>b.remove());
      if(columns.length){
        const last=columns.at(-1).headCell;
        const add=document.createElement('button');
        add.className='add-col'; add.textContent='＋'; add.title='新增一列';
        add.onclick=()=>addColumn(`Col ${columns.length+1}`);
        last.appendChild(add);
      }
    }

    function makeDataRow(value=''){
      const row=document.createElement('div'); row.className='trow';
      const cell=document.createElement('div'); cell.className='cell';
      const input=document.createElement('input'); input.value=value; cell.appendChild(input);
      const del=document.createElement('button'); del.className='clear-btn'; del.appendChild(iconDelete());
      del.onclick=()=>row.remove();
      row.appendChild(cell); row.appendChild(del);
      return row;
    }

    function appendPlaceholder(colBody){
      const ph=document.createElement('div'); ph.className='placeholder';
      const btn=document.createElement('button'); btn.className='plus-full'; btn.textContent='＋ 扫描并添加';
      ph.appendChild(btn); colBody.appendChild(ph);
      btn.onclick=()=>{ targetCol = colBody; openModalAndScan(); };
    }

    function addValueToColumn(colBody, val){
      const last = colBody.lastElementChild;
      const row = makeDataRow(val);
      colBody.insertBefore(row, last);
      row.scrollIntoView({behavior:'smooth',block:'center'});
    }

    exportBtn.onclick=()=>{
      const headers = columns.map(c => (c.titleEl.innerText || '').trim() || 'Column');
      const maxRows = Math.max(0, ...columns.map(c => c.colBody.querySelectorAll('.trow').length));
      const data = [headers];
      for(let r=0;r<maxRows;r++){
        const row = columns.map(c=>{
          const trows = c.colBody.querySelectorAll('.trow');
          return trows[r]?.querySelector('input')?.value || '';
        });
        data.push(row);
      }
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
      const d = new Date();
      const name = `codes-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.xlsx`;
      XLSX.writeFile(wb, name);
    };

    // 扫码（后置摄像头）
    const modal=$('modal'), closeBtn=$('close'), video=$('video'), hint=$('hint');
    let codeReader=null, running=false, targetCol=null;
    const constraints = { video: { facingMode: { exact: 'environment' } } };

    function openModalAndScan(){ modal.style.display='flex'; startScan(); }
    function closeModal(){ stopScan(); modal.style.display='none'; }

    async function startScan(){
      hint.textContent='Starting camera…';
      if(!codeReader) codeReader=new ZXing.BrowserMultiFormatReader();
      try{
        running=true;
        await codeReader.decodeFromConstraints(
          constraints, video,
          (result, err, controls)=>{
            if(!running) return;
            if(result){
              const val=result.getText() || '';
              onScanSuccess(val);
              try{ controls?.stop(); }catch{}
            }
          }
        );
        hint.textContent='Point at a QR / Barcode.';
      }catch(e){
        hint.textContent='Camera unavailable (need HTTPS or permission).';
      }
    }
    function stopScan(){ running=false; try{ codeReader?.reset(); }catch{} }

    function onScanSuccess(val){
      const colBody = targetCol || columns[0]?.colBody;
      if(colBody) addValueToColumn(colBody, val);
      navigator.clipboard?.writeText(val).catch(()=>{});
      setTimeout(closeModal, 300);
      targetCol = null;
    }

    closeBtn.onclick=closeModal;
    modal.onclick=e=>{ if(e.target===modal) closeModal(); };
    addEventListener('pagehide', stopScan);
    addEventListener('beforeunload', stopScan);
  </script>
</body>
</html>
