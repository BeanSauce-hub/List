<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Scanner → XLSX (Multi-Column)</title>
<style>
  :root{
    --bg:#0e0f12; --fg:#e7e9ee; --muted:#9aa1ad; --card:#14161c; --border:rgba(255,255,255,.12);
    --btn:#e6372a; --btn-press:#c82f24; --ring:#0a84ff; --danger:#ff4d4f;
    --tap:44px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    min-height:100svh; padding:calc(env(safe-area-inset-top)+3svh) 4vw calc(env(safe-area-inset-bottom)+3svh);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial;
    display:flex; align-items:flex-start; justify-content:center;
  }
  .wrap{width:100%; max-width:960px; display:flex; flex-direction:column; gap:12px}

  /* Landing */
  #landing{width:100%; display:flex; align-items:center; justify-content:center;}
  .start{
    width:180px;height:180px;border-radius:50%; display:grid;place-items:center;
    cursor:pointer; user-select:none; background:var(--btn); color:#fff;
    font-weight:800; font-size:24px; letter-spacing:.05em; border:none;
  }
  .start:active{transform:translateY(1px);background:var(--btn-press)}

  /* App */
  #app{display:none}
  .topbar{display:flex;justify-content:flex-end}
  .btn{
    appearance:none; border:1px solid var(--border); background:#1a1d25; color:#e7e9ee;
    padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer;
  }

  /* 主卡片：表头是多列栅格，最后一格是“新增列”按钮位 */
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden }
  .thead{
    display:grid; gap:8px; align-items:center;
    padding:10px 12px; border-bottom:1px solid var(--border);
  }
  .head-cell{
    display:flex; gap:8px; align-items:center;
  }
  .head-edit{
    flex:1; min-height:36px; padding:6px 8px; border-radius:8px; outline:none;
    border:1px solid transparent; background:transparent; color:#e7e9ee;
  }
  .head-edit:focus{ border-color: color-mix(in srgb,var(--ring) 35%, transparent); }

  .add-col{
    width:var(--tap); height:calc(var(--tap) - 6px); border-radius:10px; border:1px solid var(--border);
    display:grid; place-items:center; background:#1a1d25; color:#fff; font-weight:800; font-size:18px;
  }
  .add-col:active{filter:brightness(.95)}

  /* 内容区：与列数相同的栅格，每列是自己的列表 */
  .tbody{
    display:grid; gap:8px; padding:10px 12px;
  }
  .col{
    display:flex; flex-direction:column; gap:8px;
  }

  /* 数据行（单列内） */
  .trow{
    display:grid; grid-template-columns: 1fr var(--tap); gap:8px;
    border:1px solid var(--border); border-radius:12px; padding:8px 10px;
    background:#14161c;
  }
  .cell input{
    width:100%; background:transparent; border:none; color:#fff; font:inherit; padding:6px 6px;
    border-radius:8px; outline:none;
  }
  .clear-btn{
    width:var(--tap); height:var(--tap); border-radius:12px; border:1.5px solid var(--danger);
    background:transparent; display:grid; place-items:center; cursor:pointer;
  }
  .clear-btn svg{ width:22px; height:22px; stroke:var(--danger); }
  .clear-btn path{ stroke-width:2; stroke-linecap:round; fill:none; }

  /* 预留 cell（占满整列宽度） */
  .placeholder .plus-full{
    width:100%; height:var(--tap); border-radius:10px; border:1px dashed #3a3f4b;
    background:#1a1d25; color:#fff; display:grid; place-items:center;
    font-weight:800; font-size:18px;
  }
</style>

<body>
  <div class="wrap">
    <!-- Landing -->
    <section id="landing">
      <button class="start" id="startBtn">START</button>
    </section>

    <!-- App -->
    <section id="app">
      <div class="topbar">
        <button class="btn" id="exportXlsx">导出 XLSX</button>
      </div>

      <div class="card">
        <!-- 表头：N 个可编辑标题 + 末尾新增列按钮位 -->
        <div class="thead" id="thead"></div>

        <!-- 内容：N 列并排（手机端会自动换行，可横向滚动） -->
        <div class="tbody" id="tbody"></div>
      </div>
    </section>
  </div>

  <!-- 扫码弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,.55);padding:10px 12px;z-index:50">
    <div class="sheet" style="width:min(92vw,520px);margin:auto;max-height:82svh;background:#12131a;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden">
      <div class="bar" style="display:flex;justify-content:flex-end;padding:10px 12px;border-bottom:1px solid var(--border)">
        <button class="btn" id="close">Close</button>
      </div>
      <div class="stage" style="background:#000;height:54svh"><video id="video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video></div>
      <div class="hint" id="hint" style="padding:8px 12px;border-top:1px solid var(--border);color:#9aa1ad;font-size:12.5px;text-align:center">Allow camera access to start scanning.</div>
    </div>
  </div>

  <!-- 库 -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const $=id=>document.getElementById(id);
    const startBtn=$('startBtn'), landing=$('landing'), app=$('app');
    const thead=$('thead'), tbody=$('tbody');
    const exportBtn=$('exportXlsx');

    // ===== 数据模型：列数组 =====
    const columns=[]; // { title, colEl, bodyEl }

    startBtn.onclick=()=>{
      landing.style.display='none';
      app.style.display='block';
      if(columns.length===0) addColumn('Code'); // 初始一列
      layoutGrid();
    };

    // —— 新增列（只在最右列显示按钮）——
    function addColumn(title='Column'){
      // 1) header cell
      const headCell=document.createElement('div');
      headCell.className='head-cell';
      const titleEl=document.createElement('div');
      titleEl.className='head-edit';
      titleEl.contentEditable='true';
      titleEl.spellcheck=false;
      titleEl.textContent=title;
      headCell.appendChild(titleEl);
      thead.appendChild(headCell);

      // 2) body column
      const colBody=document.createElement('div');
      colBody.className='col';
      tbody.appendChild(colBody);

      // 3) 预留 cell
      appendPlaceholder(colBody);

      // 4) push model
      columns.push({ titleEl, headCell, colBody });

      // 5) 只给“最后一列”头部显示 +列按钮
      refreshAddColButton();
      layoutGrid();
    }

    function refreshAddColButton(){
      // 清掉所有 +列 按钮
      thead.querySelectorAll('.add-col').forEach(b=>b.remove());
      // 在最后一个 headCell 里追加
      if(columns.length){
        const last = columns.at(-1).headCell;
        const btn = document.createElement('button');
        btn.className='add-col';
        btn.title='新增一列';
        btn.textContent='＋';
        btn.onclick=()=> addColumn(`Col ${columns.length+1}`);
        last.appendChild(btn);
      }
    }

    // 根据列数设置栅格
    function layoutGrid(){
      const cols = Math.max(columns.length,1);
      thead.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      tbody.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      // 若超出屏幕宽，允许横向滚动
      tbody.style.overflowX = cols>=3 ? 'auto' : 'visible';
      thead.style.overflowX = cols>=3 ? 'auto' : 'visible';
    }

    // —— 列内：添加数据行 / 预留 cell —— //
    function clearIcon(){
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 24 24');
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d','M6 6l12 12M18 6L6 18');
      p.setAttribute('stroke','#ff4d4f'); p.setAttribute('stroke-width','2'); p.setAttribute('stroke-linecap','round'); p.setAttribute('fill','none');
      svg.appendChild(p);
      return svg;
    }

    function makeDataRow(value=''){
      const row=document.createElement('div'); row.className='trow';
      const cell=document.createElement('div'); cell.className='cell';
      const input=document.createElement('input');
      input.value = value; input.placeholder='';
      cell.appendChild(input);
      const clear=document.createElement('button'); clear.className='clear-btn'; clear.appendChild(clearIcon());
      clear.onclick=()=>{ input.value=''; input.focus(); };
      row.appendChild(cell); row.appendChild(clear);
      return row;
    }

    function appendPlaceholder(colBody){
      const ph=document.createElement('div'); ph.className='placeholder';
      const btn=document.createElement('button'); btn.className='plus-full'; btn.textContent='＋ 扫描并添加';
      ph.appendChild(btn);
      colBody.appendChild(ph);
      // 点击该预留，记录目标列，弹出扫描
      btn.onclick=()=>{ targetCol = colBody; openModalAndScan(); };
      return ph;
    }

    function addValueToColumn(colBody, val){
      // 找到最后一个元素（应该是 placeholder）
      const last = colBody.lastElementChild;
      // 在 placeholder 前插入数据行
      const row = makeDataRow(val);
      colBody.insertBefore(row, last);
      // 滚动可见
      row.scrollIntoView({behavior:'smooth',block:'center'});
    }

    // —— 导出 —— //
    exportBtn.onclick=()=>{
      const headers = columns.map(c => (c.titleEl.innerText || '').trim() || 'Column');
      // 取最大行数
      const maxRows = Math.max(0, ...columns.map(c => c.colBody.querySelectorAll('.trow').length));
      const data = [headers];
      for(let r=0; r<maxRows; r++){
        const row = columns.map(c=>{
          const trows = c.colBody.querySelectorAll('.trow');
          const val = trows[r]?.querySelector('input')?.value || '';
          return val;
        });
        data.push(row);
      }
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
      const dt = new Date();
      const name = `codes-${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}.xlsx`;
      XLSX.writeFile(wb, name);
    };

    // ===== 扫码（后置摄像头，ZXing） =====
    const modal=$('modal'), closeBtn=$('close'), video=$('video'), hint=$('hint');
    let codeReader=null, running=false, targetCol=null;
    const constraints = { video: { facingMode: { exact: 'environment' } } };

    function openModalAndScan(){ modal.style.display='flex'; startScan(); }
    function closeModal(){ stopScan(); modal.style.display='none'; }

    async function startScan(){
      hint.textContent='Starting camera…';
      if(!codeReader) codeReader=new ZXing.BrowserMultiFormatReader();
      try{
        running=true;
        await codeReader.decodeFromConstraints(
          constraints, video,
          (result, err, controls)=>{
            if(!running) return;
            if(result){
              const val=result.getText() || '';
              onScanSuccess(val);
              try{ controls?.stop(); }catch{}
            }else if(err && !(err instanceof ZXing.NotFoundException)){
              console.warn(err);
            }
          }
        );
        hint.textContent='Point at a QR / Barcode.';
      }catch(e){
        console.error(e);
        hint.textContent='Camera unavailable (need HTTPS or permission).';
      }
    }
    function stopScan(){ running=false; try{ codeReader?.reset(); }catch{} }

    function onScanSuccess(val){
      const colBody = targetCol || columns[0]?.colBody;
      if(colBody) addValueToColumn(colBody, val);
      navigator.clipboard?.writeText(val).catch(()=>{});
      setTimeout(closeModal, 300);
      targetCol = null;
    }

    closeBtn.onclick=closeModal;
    modal.onclick=e=>{ if(e.target===modal) closeModal(); };
    addEventListener('pagehide', stopScan);
    addEventListener('beforeunload', stopScan);
  </script>
</body>
</html>
