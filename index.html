<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SmartScan</title>

<style>
:root{
--bg:#0e0f12; --fg:#e7e9ee; --muted:#9aa1ad; --card:#14161c; --border:rgba(255,255,255,.12);
--btn:#e6372a; --btn-press:#c82f24; --ring:#0a84ff; --danger:#ff4d4f;
--tap:44px; --colw:320px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
background:var(--bg);
color:var(--fg);
font:16px/1.5 ui-sans-serif,system-ui;
}

.wrap{
max-width:1000px;
margin:auto;
padding:18px;
display:flex;
flex-direction:column;
gap:12px;
}

#landing{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:var(--bg);
z-index:1000;
}

.start{
width:240px;
height:240px;
border-radius:50%;
background:var(--btn);
color:#fff;
font-size:32px;
font-weight:900;
border:none;
cursor:pointer;
}

#app{display:none}

.topbar{
display:flex;
justify-content:flex-end
}

.btn{
background:#1a1d25;
border:1px solid var(--border);
color:#fff;
padding:8px 12px;
border-radius:10px;
cursor:pointer
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
overflow:hidden
}

.thead,.tbody{
display:flex;
gap:8px;
padding:10px 12px;
overflow-x:auto
}

.thead{
border-bottom:1px solid var(--border)
}

.head-cell{
min-width:var(--colw);
display:flex;
gap:8px
}

.head-edit{
flex:1;
background:transparent;
color:#fff;
border:none;
outline:none
}

.del-col,.add-col{
width:36px;
height:36px;
border-radius:10px;
background:#1a1d25;
border:1px solid var(--border);
cursor:pointer
}

.col{
min-width:var(--colw);
display:flex;
flex-direction:column;
gap:8px
}

.trow{
display:grid;
grid-template-columns:1fr 44px;
gap:8px;
border:1px solid var(--border);
border-radius:12px;
padding:8px
}

.cell input{
width:100%;
background:transparent;
border:none;
color:#fff;
outline:none
}

.clear-btn{
border:1px solid var(--danger);
border-radius:12px;
cursor:pointer
}

.placeholder .plus-full{
width:100%;
height:44px;
border-radius:10px;
border:1px dashed #3a3f4b;
background:#1a1d25;
color:#fff;
font-weight:800
}
</style>

<body>

<div class="wrap">

<section id="landing">
<button class="start" id="startBtn">START</button>
</section>

<section id="app">

<div class="topbar">
<button class="btn" id="exportXlsx">Export Sheet</button>
</div>

<div class="card">
<div class="thead" id="thead"></div>
<div class="tbody" id="tbody"></div>
</div>

</section>
</div>


<div id="modal" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,.55);padding:10px;z-index:50">

<div style="width:min(92vw,520px);margin:auto;background:#12131a;border:1px solid var(--border);border-radius:14px">

<div style="display:flex;justify-content:flex-end;padding:10px">
<button class="btn" id="close">Close</button>
</div>

<div style="background:#000;height:54vh">
<video id="video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
</div>

<div id="hint" style="padding:8px;text-align:center;color:#9aa1ad">
Allow camera access
</div>

</div>
</div>


<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

const $=id=>document.getElementById(id)

const startBtn=$("startBtn")
const landing=$("landing")
const app=$("app")
const thead=$("thead")
const tbody=$("tbody")
const exportBtn=$("exportXlsx")

const modal=$("modal")
const closeBtn=$("close")
const video=$("video")
const hint=$("hint")

const columns=[]

let codeReader=null
let running=false
let targetCol=null

let lastScanText=''
let lastScanAt=0

const SCAN_COOLDOWN_MS=800


startBtn.onclick=()=>{
landing.remove()
app.style.display="block"
addColumn("Code")
}


function addColumn(title="Column"){

const head=document.createElement("div")
head.className="head-cell"

const t=document.createElement("div")
t.className="head-edit"
t.contentEditable=true
t.textContent=title

head.appendChild(t)

thead.appendChild(head)

const col=document.createElement("div")
col.className="col"

tbody.appendChild(col)

appendPlaceholder(col)

columns.push({titleEl:t,headCell:head,colBody:col})
}



function appendPlaceholder(col){

const ph=document.createElement("div")
ph.className="placeholder"

const btn=document.createElement("button")
btn.className="plus-full"
btn.textContent="SCAN"

ph.appendChild(btn)
col.appendChild(ph)

btn.onclick=()=>{
targetCol=col
openModalAndScan()
}

}


function makeDataRow(value=""){

const r=document.createElement("div")
r.className="trow"

const c=document.createElement("div")
c.className="cell"

const input=document.createElement("input")
input.value=value

c.appendChild(input)

const del=document.createElement("button")
del.className="clear-btn"
del.textContent="X"

del.onclick=()=>r.remove()

r.appendChild(c)
r.appendChild(del)

return r
}


function addValueToColumn(col,val){

const last=col.lastElementChild

const row=makeDataRow(val)

col.insertBefore(row,last)

}



function alreadyInColumn(col,val){

return [...col.querySelectorAll("input")]
.some(i=>i.value===val)

}



function feedback(ok=true){

if(navigator.vibrate){
navigator.vibrate(ok?40:[40,40,40])
}

try{

const ctx=new (window.AudioContext||window.webkitAudioContext)()

const o=ctx.createOscillator()
const g=ctx.createGain()

o.frequency.value=ok?900:220
g.gain.value=.05

o.connect(g)
g.connect(ctx.destination)

o.start()

setTimeout(()=>{

o.stop()
ctx.close()

},80)

}catch{}

}



exportBtn.onclick=()=>{

const headers=columns.map(c=>c.titleEl.innerText)

const maxRows=Math.max(0,...columns.map(c=>c.colBody.querySelectorAll(".trow").length))

const data=[headers]

for(let r=0;r<maxRows;r++){

const row=columns.map(c=>{

const trs=c.colBody.querySelectorAll(".trow")

return trs[r]?.querySelector("input")?.value||''

})

data.push(row)

}

const ws=XLSX.utils.aoa_to_sheet(data)

const wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,"Sheet1")

XLSX.writeFile(wb,"SmartScan.xlsx")

}



function openModalAndScan(){

modal.style.display="flex"

startScan()

}



function closeModal(){

stopScan()

modal.style.display="none"

}



async function startScan(){

hint.textContent="Starting camera..."

if(!codeReader)
codeReader=new ZXing.BrowserMultiFormatReader()

running=true


try{

await codeReader.decodeFromConstraints(

{video:{facingMode:"environment"}},

video,

(result,err,controls)=>{

if(!running)return

if(result){

const val=result.getText()

onScanSuccess(val)

controls.stop()

}

}

)

hint.textContent="Point camera to barcode"

}catch{

try{

await codeReader.decodeFromConstraints(

{video:true},

video,

(result,err,controls)=>{

if(!running)return

if(result){

const val=result.getText()

onScanSuccess(val)

controls.stop()

}

}

)

}catch{

hint.textContent="Camera unavailable"

}

}

}



function stopScan(){

running=false

try{codeReader.reset()}catch{}

const stream=video.srcObject

if(stream){

stream.getTracks().forEach(t=>t.stop())

video.srcObject=null

}

}



function onScanSuccess(val){

val=val.trim()

if(!val)return

const now=Date.now()

if(val===lastScanText && now-lastScanAt<SCAN_COOLDOWN_MS)return

lastScanText=val
lastScanAt=now

const col=targetCol||columns[0]?.colBody

if(alreadyInColumn(col,val)){

feedback(false)

hint.textContent="Duplicate scan"

return

}

addValueToColumn(col,val)

feedback(true)

hint.textContent="Scanned: "+val

setTimeout(closeModal,250)

}



closeBtn.onclick=closeModal

modal.onclick=e=>{
if(e.target===modal)closeModal()
}

</script>

</body>
</html>
