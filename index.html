<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Scanner → XLSX (One Column)</title>
<style>
  :root{
    /* 颜色与尺寸 */
    --bg:#0e0f12; --fg:#e7e9ee; --muted:#9aa1ad; --card:#14161c; --border:rgba(255,255,255,.12);
    --btn:#e6372a; --btn-press:#c82f24; --ring:#0a84ff; --danger:#ff4d4f;
    --tap:40px; /* 移动端可点尺寸（最小 40px） */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    min-height:100svh;
    padding:calc(env(safe-area-inset-top)+3svh) 4vw calc(env(safe-area-inset-bottom)+3svh);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; align-items:flex-start; justify-content:center;
  }
  .wrap{width:100%; max-width:720px; display:flex; flex-direction:column; gap:12px}

  /* —— Landing —— */
  #landing{width:100%; display:flex; align-items:center; justify-content:center;}
  .start{
    width:180px;height:180px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;user-select:none;
    background:var(--btn);color:#fff;font-weight:800;font-size:24px;letter-spacing:.05em;
    border:none;transition:transform .06s ease,background-color .06s ease,box-shadow .06s ease;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .start:active{transform:translateY(1px);background:var(--btn-press)}
  .start:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ring) 35%,transparent)}

  /* —— App —— */
  #app{display:none}
  .topbar{display:flex;justify-content:flex-end}
  .btn{
    appearance:none; border:1px solid var(--border); background:#1a1d25; color:var(--fg);
    padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer; text-decoration:none;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .btn:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 32%,transparent)}

  /* 表格卡片 */
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden }
  .thead{ display:grid; grid-template-columns: 1fr 56px; align-items:center;
          padding:10px 12px; border-bottom:1px solid var(--border); color:#cfd5df; font-size:13px; gap:8px }
  .head-edit{
    min-height:36px; display:flex; align-items:center; padding:6px 8px; border-radius:8px;
    outline:none; border:1px solid transparent; background:transparent; color:#e7e9ee;
  }
  .head-edit:focus{ border-color: color-mix(in srgb,var(--ring) 35%, transparent); }

  .add{
    width:var(--tap); height:calc(var(--tap) - 4px); border-radius:10px; border:1px solid var(--border);
    display:grid; place-items:center; background:#1a1d25; color:#fff; cursor:pointer;
    font-weight:700; font-size:18px; line-height:1; touch-action:manipulation;
  }
  .add:active{filter:brightness(.95)}
  .add:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 32%,transparent)}

  .trow{
    padding:8px 12px; border-top:1px solid var(--border);
    display:grid; grid-template-columns: 1fr var(--tap); align-items:center; gap:8px;
  }
  .cell{ min-height:40px; display:flex; align-items:center; overflow:hidden }
  .cell input{
    width:100%; background:transparent; border:none; color:#fff; font:inherit; padding:6px 8px;
    border-radius:8px; outline:none;
  }
  .cell input::placeholder{ color:#717784 }

  /* 清空按钮：使用 SVG 图标（跨机型一致） */
  .clear-btn{
    width:var(--tap); height:var(--tap); border-radius:12px;
    border:1.5px solid var(--danger); background:transparent; color:var(--danger);
    display:grid; place-items:center; cursor:pointer; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .12s ease, transform .06s ease, box-shadow .12s ease;
  }
  .clear-btn:hover{ background:color-mix(in srgb,var(--danger) 12%, transparent); }
  .clear-btn:active{ transform:translateY(1px); background:color-mix(in srgb,var(--danger) 18%, transparent); }
  .clear-btn:focus-visible{ outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 35%, transparent); }
  .clear-btn svg{ width:22px; height:22px; stroke:var(--danger); }

  /* 扫码弹窗 */
  .modal{ position:fixed; inset:0; display:none; z-index:50; background:rgba(0,0,0,.55);
          padding:calc(env(safe-area-inset-top)+10px) 12px calc(env(safe-area-inset-bottom)+10px); }
  .modal.show{ display:flex; align-items:center; justify-content:center }
  .sheet{
    width:min(92vw,520px); max-height:min(82svh,82dvh);
    background:#12131a; border:1px solid var(--border); border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .bar{ display:flex; justify-content:flex-end; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border) }
  .x{ appearance:none; border:1px solid var(--border); background:#161821; color:#e7e9ee;
      border-radius:10px; padding:6px 10px; font-size:13px; cursor:pointer }
  .stage{ position:relative; background:#000; height:clamp(240px,54svh,520px) }
  video{ width:100%; height:100%; object-fit:cover }
  .res{ padding:10px 12px; border-top:1px solid var(--border); display:none; color:#cfd5df }
  .res pre{ margin-top:6px; white-space:pre-wrap; word-break:break-word; font-size:13px; max-height:22svh; overflow:auto }
  .hint{ padding:8px 12px; border-top:1px solid var(--border); color:#9aa1ad; font-size:12.5px; text-align:center }
</style>

<body>
  <div class="wrap">
    <!-- Landing -->
    <section id="landing">
      <button class="start" id="startBtn" aria-label="Start">START</button>
    </section>

    <!-- App -->
    <section id="app" aria-live="polite">
      <div class="topbar">
        <button class="btn" id="exportXlsx">导出 XLSX</button>
      </div>

      <div class="card">
        <div class="thead">
          <div id="colName" class="head-edit" contenteditable="true" spellcheck="false" aria-label="编辑表头">Code</div>
          <button class="add" id="addBtn" title="扫描并添加" aria-label="扫描并添加">＋</button>
        </div>
        <div id="tbody"></div>
      </div>
    </section>
  </div>

  <!-- 扫码弹窗 -->
  <div class="modal" id="modal" aria-modal="true" role="dialog">
    <div class="sheet">
      <div class="bar"><button class="x" id="close">Close</button></div>
      <div class="stage"><video id="video" playsinline muted></video></div>
      <div class="res" id="res"><pre id="text"></pre></div>
      <div class="hint" id="hint">Allow camera access to start scanning.</div>
    </div>
  </div>

  <!-- 库：ZXing（扫码）+ SheetJS（导出） -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    /************ 视图切换 ************/
    const $=id=>document.getElementById(id);
    const startBtn=$('startBtn'), landing=$('landing'), app=$('app');

    startBtn.onclick=()=>{
      landing.style.display='none';
      app.style.display='block';
      if(!tbody.hasChildNodes()){
        for(let i=0;i<3;i++) addRow('');
      }
    };

    /************ 表格逻辑 ************/
    const tbody=$('tbody');
    const addBtn=$('addBtn');
    const exportBtn=$('exportXlsx');
    const colNameEl=$('colName');

    function clearButtonSVG(){
      // 内嵌 SVG 红色叉叉，跨机型一致
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" role="img">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="2" stroke-linecap="round"/>
        </svg>
      `;
    }

    function addRow(value=''){
      const row=document.createElement('div');
      row.className='trow';
      row.innerHTML=`
        <div class="cell">
          <input type="text" placeholder="扫描结果将填入这里"
                 value="${(value??'').toString().replace(/"/g,'&quot;')}" aria-label="单元格内容">
        </div>
        <button class="clear-btn" type="button" title="清空该行" aria-label="清空该行">
          ${clearButtonSVG()}
        </button>
      `;
      tbody.appendChild(row);
      return row;
    }

    // 清空：事件委托
    tbody.addEventListener('click', e=>{
      const btn=e.target.closest('.clear-btn');
      if(btn){
        const input=btn.parentElement.querySelector('input');
        if(input){ input.value=''; input.focus(); }
      }
    });

    function getFirstEmptyInput(){
      return [...tbody.querySelectorAll('input')].find(i => !i.value.trim());
    }

    exportBtn.onclick=()=>{
      const header = (colNameEl.innerText || 'Code').trim();
      const data = [[header]];
      tbody.querySelectorAll('input').forEach(i => data.push([i.value || '']));
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
      const dt = new Date();
      const name = `codes-${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}.xlsx`;
      XLSX.writeFile(wb, name);
    };

    /************ 扫码逻辑（后置摄像头，ZXing） ************/
    const modal=$('modal'), closeBtn=$('close');
    const video=$('video'), hint=$('hint'), resBox=$('res'), textBox=$('text');

    let codeReader=null, running=false;

    // 强制后置摄像头（若 exact 抛错，可改为 ideal）
    const constraints = { video: { facingMode: { exact: 'environment' } } };

    function openModalAndScan(){
      modal.classList.add('show');
      startScan();
    }
    function closeModal(){
      stopScan();
      modal.classList.remove('show');
      resBox.style.display='none';
      textBox.textContent='';
    }

    async function startScan(){
      hint.textContent='Starting camera…';
      if(!codeReader) codeReader=new ZXing.BrowserMultiFormatReader();
      try{
        running=true;
        await codeReader.decodeFromConstraints(
          constraints,
          video,
          (result, err, controls)=>{
            if(!running) return;
            if(result){
              const value=result.getText() || '';
              onScanSuccess(value);
              try{ controls?.stop(); }catch{}
            }else if(err && !(err instanceof ZXing.NotFoundException)){
              console.warn(err);
            }
          }
        );
        hint.textContent='Point at a QR / Barcode.';
      }catch(e){
        console.error(e);
        hint.textContent='Camera unavailable (need HTTPS or permission).';
      }
    }

    function stopScan(){
      running=false;
      try{ codeReader?.reset(); }catch{}
    }

    function onScanSuccess(val){
      let input = getFirstEmptyInput();
      if(!input) input = addRow('').querySelector('input');
      input.value = val;

      resBox.style.display='block';
      textBox.textContent=val;
      hint.textContent='Result copied to clipboard.';
      navigator.clipboard?.writeText(val).catch(()=>{});

      // 自动关闭
      setTimeout(closeModal, 400);
      // 自动滚动到新值
      input.scrollIntoView({ behavior:'smooth', block:'center' });
    }

    // 只通过表头「＋」触发扫码
    addBtn.onclick=()=>{ openModalAndScan(); };

    // 关闭弹窗
    closeBtn.onclick=closeModal;
    modal.onclick=e=>{ if(e.target===modal) closeModal(); };

    // 页面离开释放摄像头
    addEventListener('pagehide', stopScan);
    addEventListener('beforeunload', stopScan);
  </script>
</body>
</html>
